<svg viewBox="0 0 800 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Xưởng đồng hồ tại Villeret — khởi đầu Blancpain năm 1735</title>
  <defs>
    <pattern id="gui-blancpain" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="none" stroke="#B8893C" stroke-width="0.4" opacity="0.11"/>
      <circle cx="20" cy="20" r="4" fill="none" stroke="#B8893C" stroke-width="0.3" opacity="0.11"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#B8893C" stroke-width="0.25" opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#1F2D3D"/>
  <rect width="800" height="600" fill="url(#gui-blancpain)"/>

  <!-- ====== MÁI NHÀ DỐC ====== -->
  <!-- Mép trái mái -->
  <line x1="120" y1="200" x2="280" y2="100" stroke="#B8893C" stroke-width="3" stroke-linecap="round"/>
  <!-- Mép phải mái -->
  <line x1="280" y1="100" x2="680" y2="160" stroke="#B8893C" stroke-width="3" stroke-linecap="round"/>
  <!-- Đỉnh mái (gỗ) -->
  <line x1="280" y1="100" x2="280" y2="180" stroke="#B8893C" stroke-width="1.75"/>

  <!-- ====== TƯỜNG + CỬA SỔ NHIỀU Ô KÍNH (chiếm phần lớn tường) ====== -->
  <!-- Khung tường ngoài -->
  <line x1="120" y1="200" x2="120" y2="480" stroke="#B8893C" stroke-width="3" stroke-linecap="round"/>
  <line x1="680" y1="160" x2="680" y2="480" stroke="#B8893C" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="480" x2="680" y2="480" stroke="#B8893C" stroke-width="3" stroke-linecap="round"/>

  <!-- Cửa sổ lớn (phần lớn tường phải) -->
  <rect x="320" y="190" width="320" height="240" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <!-- Ô kính: 4 cột × 3 hàng -->
  <g stroke="#B8893C" stroke-width="1.75">
    <line x1="400" y1="190" x2="400" y2="430"/>
    <line x1="480" y1="190" x2="480" y2="430"/>
    <line x1="560" y1="190" x2="560" y2="430"/>
    <line x1="320" y1="270" x2="640" y2="270"/>
    <line x1="320" y1="350" x2="640" y2="350"/>
  </g>
  <!-- Ánh sáng qua kính (vùng sáng — gạch thưa) -->
  <g stroke="#FAF7F2" stroke-width="1" stroke-linecap="round" opacity="0.15">
    <line x1="330" y1="200" x2="395" y2="200"/>
    <line x1="330" y1="210" x2="395" y2="210"/>
    <line x1="330" y1="220" x2="395" y2="220"/>
    <line x1="330" y1="230" x2="395" y2="230"/>
    <line x1="410" y1="200" x2="475" y2="200"/>
    <line x1="410" y1="210" x2="475" y2="210"/>
    <line x1="410" y1="220" x2="475" y2="220"/>
    <line x1="490" y1="200" x2="555" y2="200"/>
    <line x1="490" y1="210" x2="555" y2="210"/>
  </g>

  <!-- ====== BÀN THỢ (phía dưới, trước cửa sổ) ====== -->
  <!-- Mặt bàn -->
  <rect x="160" y="400" width="240" height="12" fill="none" stroke="#B8893C" stroke-width="3" stroke-linejoin="round"/>
  <!-- Chân bàn trái -->
  <line x1="175" y1="412" x2="175" y2="480" stroke="#B8893C" stroke-width="1.75"/>
  <!-- Chân bàn phải -->
  <line x1="385" y1="412" x2="385" y2="480" stroke="#B8893C" stroke-width="1.75"/>

  <!-- Kính lúp đeo mắt trên bàn -->
  <circle cx="220" cy="388" r="14" fill="none" stroke="#FAF7F2" stroke-width="1.75"/>
  <circle cx="220" cy="388" r="10" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.5"/>
  <!-- Dây đeo kính -->
  <path d="M 206 388 Q 200 380 195 390" fill="none" stroke="#B8893C" stroke-width="1"/>

  <!-- Dụng cụ nhỏ trên bàn -->
  <rect x="260" y="390" width="30" height="10" rx="2" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <line x1="300" y1="395" x2="330" y2="395" stroke="#B8893C" stroke-width="1.75" stroke-linecap="round"/>
  <circle cx="350" cy="392" r="6" fill="none" stroke="#B8893C" stroke-width="1.75"/>

  <!-- ====== GẠCH TẠO KHỐI ====== -->
  <!-- Vùng tối đậm (tường trái, dưới mái) -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round">
    <line x1="135" y1="230" x2="175" y2="230" opacity="0.6"/>
    <line x1="135" y1="236" x2="175" y2="236" opacity="0.6"/>
    <line x1="135" y1="242" x2="175" y2="242" opacity="0.6"/>
    <line x1="135" y1="248" x2="175" y2="248" opacity="0.6"/>
    <line x1="135" y1="254" x2="175" y2="254" opacity="0.6"/>
    <line x1="135" y1="260" x2="170" y2="260" opacity="0.6"/>
    <line x1="135" y1="266" x2="170" y2="266" opacity="0.6"/>
    <line x1="140" y1="272" x2="170" y2="272" opacity="0.6"/>
    <line x1="140" y1="278" x2="165" y2="278" opacity="0.6"/>
  </g>
  <!-- Vùng chuyển tiếp (dưới bàn, bóng sàn) -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round" opacity="0.35">
    <line x1="180" y1="450" x2="380" y2="450"/>
    <line x1="180" y1="458" x2="380" y2="458"/>
    <line x1="185" y1="466" x2="375" y2="466"/>
  </g>

  <!-- ====== CỬA SỔ NHỎ (tường trái, trên bàn) ====== -->
  <rect x="135" y="300" width="80" height="80" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <line x1="175" y1="300" x2="175" y2="380" stroke="#B8893C" stroke-width="1.75"/>
  <line x1="135" y1="340" x2="215" y2="340" stroke="#B8893C" stroke-width="1.75"/>
</svg>
