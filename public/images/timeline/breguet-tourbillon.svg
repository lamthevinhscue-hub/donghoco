<svg viewBox="0 0 800 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Lồng tourbillon — cơ chế xoay bù sai số trọng lực do Breguet sáng chế</title>
  <defs>
    <pattern id="gui-breguet-tourbillon" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="none" stroke="#B8893C" stroke-width="0.4" opacity="0.11"/>
      <circle cx="20" cy="20" r="4" fill="none" stroke="#B8893C" stroke-width="0.3" opacity="0.11"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#B8893C" stroke-width="0.25" opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#1F2D3D"/>
  <rect width="800" height="600" fill="url(#gui-breguet-tourbillon)"/>

  <!-- ====== CẦU MÁY phía trên — nối vào lồng, 2 đầu vát ====== -->
  <!-- Thanh ngang vát 2 đầu -->
  <path d="M 230 150 L 250 130 L 550 130 L 570 150 L 550 170 L 250 170 Z"
        fill="none" stroke="#B8893C" stroke-width="3" stroke-linejoin="round"/>
  <!-- Vít 2 đầu cầu -->
  <circle cx="265" cy="150" r="7" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <line x1="260" y1="150" x2="270" y2="150" stroke="#B8893C" stroke-width="1.75"/>
  <circle cx="535" cy="150" r="7" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <line x1="530" y1="150" x2="540" y2="150" stroke="#B8893C" stroke-width="1.75"/>
  <!-- Trụ nối cầu xuống lồng -->
  <line x1="400" y1="170" x2="400" y2="210" stroke="#B8893C" stroke-width="3" stroke-linecap="round"/>

  <!-- ====== LỒNG TOURBILLON — vòng tròn ngoài ====== -->
  <circle cx="400" cy="370" r="170" fill="none" stroke="#B8893C" stroke-width="3"/>

  <!-- ====== 3 NAN CONG TỎA TÂM — đặc trưng nhận diện bắt buộc ====== -->
  <!-- Mỗi nan là một cung cong từ tâm ra vành, cách nhau 120° -->
  <!-- Nan 1: hướng lên (12 giờ) -->
  <path d="M 400 370 Q 420 320 400 210 Q 380 320 400 370" fill="none" stroke="#B8893C" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Nan 2: hướng xuống-phải (4 giờ, 120°) -->
  <path d="M 400 370 Q 450 380 545 460 Q 480 400 400 370" fill="none" stroke="#B8893C" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Nan 3: hướng xuống-trái (8 giờ, 240°) -->
  <path d="M 400 370 Q 350 380 255 460 Q 320 400 400 370" fill="none" stroke="#B8893C" stroke-width="1.75" stroke-linecap="round"/>

  <!-- ====== BÁNH LẮC bên trong lồng ====== -->
  <circle cx="400" cy="370" r="95" fill="none" stroke="#FAF7F2" stroke-width="1.75"/>
  <!-- 3 nan chéo trên bánh lắc -->
  <line x1="400" y1="280" x2="400" y2="460" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="322" y1="325" x2="478" y2="415" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="478" y1="325" x2="322" y2="415" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>

  <!-- Bánh thoát (nhỏ, đáy lồng) -->
  <circle cx="400" cy="455" r="22" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <line x1="400" y1="433" x2="400" y2="427" stroke="#B8893C" stroke-width="1"/>
  <line x1="422" y1="455" x2="428" y2="455" stroke="#B8893C" stroke-width="1"/>
  <line x1="378" y1="455" x2="372" y2="455" stroke="#B8893C" stroke-width="1"/>

  <!-- ====== MŨI TÊN ÔM QUANH LỒNG — chỉ chiều xoay ====== -->
  <!-- Cung lớn ôm ¾ vòng lồng -->
  <path d="M 400 200 Q 580 210 590 370 Q 580 510 440 535"
        fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Đầu mũi tên (tam giác) -->
  <path d="M 445 525 L 432 540 L 448 545 Z" fill="#FAF7F2" stroke="none"/>

  <!-- Gạch tạo khối: vùng tối (giữa lồng, dưới bánh thoát) -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round">
    <line x1="380" y1="490" x2="420" y2="490" opacity="0.5"/>
    <line x1="380" y1="496" x2="420" y2="496" opacity="0.5"/>
    <line x1="385" y1="502" x2="415" y2="502" opacity="0.5"/>
  </g>
  <!-- Vùng chuyển tiếp (trên, giữa cầu và lồng) -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round" opacity="0.35">
    <line x1="370" y1="185" x2="395" y2="185"/>
    <line x1="370" y1="195" x2="395" y2="195"/>
    <line x1="370" y1="205" x2="395" y2="205"/>
  </g>

  <!-- Trục giữa -->
  <circle cx="400" cy="370" r="8" fill="none" stroke="#FAF7F2" stroke-width="3"/>
  <circle cx="400" cy="370" r="3" fill="#FAF7F2"/>
</svg>
