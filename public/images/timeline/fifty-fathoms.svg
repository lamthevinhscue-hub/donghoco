<svg viewBox="0 0 800 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Blancpain Fifty Fathoms 1953 — nhìn nghiêng từ dưới nước</title>
  <defs>
    <pattern id="gui-fifty-fathoms" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="none" stroke="#B8893C" stroke-width="0.4" opacity="0.11"/>
      <circle cx="20" cy="20" r="4" fill="none" stroke="#B8893C" stroke-width="0.3" opacity="0.11"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#B8893C" stroke-width="0.25" opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#1F2D3D"/>
  <rect width="800" height="600" fill="url(#gui-fifty-fathoms)"/>

  <!-- ====== CỘT NƯỚC + BỌT KHÍ (nửa dưới, chiếm lớn) ====== -->
  <!-- Cột nước mờ đổ lên -->
  <g stroke="#FAF7F2" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.08">
    <path d="M 60 600 Q 100 400 140 600"/>
    <path d="M 200 600 Q 260 380 320 600"/>
    <path d="M 520 600 Q 580 400 640 600"/>
    <path d="M 660 600 Q 720 420 760 600"/>
  </g>

  <!-- Bọt khí nhỏ dần khi lên cao (lớn ở dưới, nhỏ dần lên trên) -->
  <circle cx="150" cy="540" r="10" fill="none" stroke="#FAF7F2" stroke-width="1" opacity="0.45"/>
  <circle cx="210" cy="500" r="8" fill="none" stroke="#FAF7F2" stroke-width="1" opacity="0.4"/>
  <circle cx="130" cy="470" r="6" fill="none" stroke="#FAF7F2" stroke-width="1" opacity="0.35"/>
  <circle cx="250" cy="440" r="5" fill="none" stroke="#FAF7F2" stroke-width="1" opacity="0.3"/>
  <circle cx="180" cy="410" r="4" fill="none" stroke="#FAF7F2" stroke-width="1" opacity="0.25"/>
  <circle cx="630" cy="530" r="9" fill="none" stroke="#FAF7F2" stroke-width="1" opacity="0.4"/>
  <circle cx="690" cy="495" r="7" fill="none" stroke="#FAF7F2" stroke-width="1" opacity="0.35"/>
  <circle cx="600" cy="460" r="5" fill="none" stroke="#FAF7F2" stroke-width="1" opacity="0.3"/>
  <circle cx="660" cy="425" r="4" fill="none" stroke="#FAF7F2" stroke-width="1" opacity="0.25"/>
  <circle cx="720" cy="445" r="3" fill="none" stroke="#FAF7F2" stroke-width="1" opacity="0.2"/>

  <!-- ====== ĐỒNG HỒ NGHIÊNG (nhìn chếch — vỏ elip vì phối cảnh) ====== -->
  <!-- Vỏ ngoài nghiêng: elip rộng 300, cao 160 -->
  <ellipse cx="400" cy="280" rx="150" ry="85" fill="none" stroke="#B8893C" stroke-width="3"/>
  <ellipse cx="400" cy="280" rx="138" ry="78" fill="none" stroke="#B8893C" stroke-width="1.75" opacity="0.5"/>

  <!-- ====== VÀNH XOAY MỘT CHIỀU (đặc trưng an toàn) ====== -->
  <!-- Vành nghiêng = elip hẹp hơn -->
  <ellipse cx="400" cy="280" rx="125" ry="68" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <!-- Vạch chia vành (những vạch nổi lên trên cung elip phía trên) -->
  <g stroke="#B8893C" stroke-linecap="round">
    <line x1="400" y1="212" x2="400" y2="202" stroke-width="1.75"/>
    <line x1="438" y1="216" x2="440" y2="207" stroke-width="1"/>
    <line x1="475" y1="225" x2="479" y2="217" stroke-width="1"/>
    <line x1="508" y1="240" x2="514" y2="234" stroke-width="1.75"/>
    <line x1="535" y1="262" x2="543" y2="258" stroke-width="1"/>
    <line x1="522" y1="304" x2="531" y2="306" stroke-width="1"/>
    <line x1="498" y1="328" x2="505" y2="335" stroke-width="1.75"/>
    <line x1="465" y1="344" x2="469" y2="352" stroke-width="1"/>
    <line x1="400" y1="350" x2="400" y2="360" stroke-width="1.75"/>
    <line x1="335" y1="344" x2="331" y2="352" stroke-width="1"/>
    <line x1="302" y1="328" x2="295" y2="335" stroke-width="1.75"/>
    <line x1="278" y1="304" x2="269" y2="306" stroke-width="1"/>
    <line x1="265" y1="262" x2="257" y2="258" stroke-width="1"/>
    <line x1="292" y1="240" x2="286" y2="234" stroke-width="1.75"/>
    <line x1="325" y1="225" x2="321" y2="217" stroke-width="1"/>
    <line x1="362" y1="216" x2="360" y2="207" stroke-width="1"/>
  </g>

  <!-- Chấm tam giác ở mốc 0 (12 giờ — đặc trưng vành lặn) -->
  <path d="M 400 208 L 409 222 L 391 222 Z" fill="#FAF7F2"/>

  <!-- Mũi tên 1 chiều (chỉ xoay được một chiều — an toàn) -->
  <path d="M 540 190 Q 575 180 590 200" fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round" opacity="0.7"/>
  <path d="M 585 193 L 595 200 L 585 207" fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round" opacity="0.7"/>

  <!-- ====== MẶT SỐ (cọc số dạ quang bản to, nhìn nghiêng nên nén dọc) ====== -->
  <circle cx="400" cy="225" r="6" fill="#FAF7F2"/>
  <circle cx="490" cy="255" r="6" fill="#FAF7F2"/>
  <circle cx="510" cy="290" r="6" fill="#FAF7F2"/>
  <circle cx="490" cy="320" r="6" fill="#FAF7F2"/>
  <circle cx="400" cy="340" r="6" fill="#FAF7F2"/>
  <circle cx="310" cy="320" r="6" fill="#FAF7F2"/>
  <circle cx="290" cy="290" r="6" fill="#FAF7F2"/>
  <circle cx="310" cy="255" r="6" fill="#FAF7F2"/>

  <!-- Kim dạ quang bản to (ngắn vì nhìn nghiêng) -->
  <rect x="397" y="245" width="6" height="40" rx="2" fill="#FAF7F2"/>
  <line x1="400" y1="280" x2="455" y2="320" stroke="#FAF7F2" stroke-width="4" stroke-linecap="round"/>
  <circle cx="400" cy="280" r="6" fill="#FAF7F2"/>

  <!-- ====== GẠCH TẠO KHỐI — vùng nước phía dưới ====== -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round">
    <line x1="320" y1="430" x2="480" y2="430" opacity="0.4"/>
    <line x1="310" y1="440" x2="490" y2="440" opacity="0.4"/>
    <line x1="315" y1="450" x2="485" y2="450" opacity="0.4"/>
    <line x1="325" y1="460" x2="475" y2="460" opacity="0.4"/>
  </g>
  <!-- Vùng tối phía dưới-nhỏ -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round" opacity="0.3">
    <line x1="120" y1="560" x2="200" y2="560"/>
    <line x1="125" y1="568" x2="205" y2="568"/>
    <line x1="600" y1="560" x2="680" y2="560"/>
    <line x1="605" y1="568" x2="685" y2="568"/>
  </g>
</svg>
