<svg viewBox="0 0 800 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Cơ chế lên cót tự động Harwood 1923 — con lắc quạt quét nửa vòng</title>
  <defs>
    <pattern id="gui-harwood-automatic" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="none" stroke="#B8893C" stroke-width="0.4" opacity="0.11"/>
      <circle cx="20" cy="20" r="4" fill="none" stroke="#B8893C" stroke-width="0.3" opacity="0.11"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#B8893C" stroke-width="0.25" opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#1F2D3D"/>
  <rect width="800" height="600" fill="url(#gui-harwood-automatic)"/>

  <!-- ====== THÙNG CÓT (trái, nối vào con lắc) ====== -->
  <circle cx="200" cy="300" r="55" fill="none" stroke="#B8893C" stroke-width="3"/>
  <circle cx="200" cy="300" r="45" fill="none" stroke="#B8893C" stroke-width="1.75" opacity="0.5"/>
  <!-- Trục cót (lò xo cuộn — vẽ bằng xoắn ốc) -->
  <g stroke="#B8893C" stroke-width="1" fill="none" opacity="0.4">
    <circle cx="200" cy="300" r="35"/>
    <circle cx="200" cy="300" r="28"/>
    <circle cx="200" cy="300" r="21"/>
    <circle cx="200" cy="300" r="14"/>
    <circle cx="200" cy="300" r="7"/>
  </g>
  <circle cx="200" cy="300" r="5" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <!-- Bánh răng ngoài thùng cót -->
  <g stroke="#B8893C" stroke-width="1.75" stroke-linecap="round">
    <line x1="200" y1="245" x2="200" y2="240"/>
    <line x1="227" y1="255" x2="230" y2="252"/>
    <line x1="255" y1="273" x2="258" y2="272"/>
    <line x1="200" y1="355" x2="200" y2="360"/>
    <line x1="173" y1="345" x2="170" y2="348"/>
    <line x1="145" y1="327" x2="142" y2="328"/>
  </g>
  <!-- Nối thùng cót sang con lắc -->
  <line x1="255" y1="300" x2="320" y2="300" stroke="#B8893C" stroke-width="1.75"/>

  <!-- ====== CON LẮC HÌNH QUẠT — CHỈ QUÉT NỬA VÒNG (đặc trưng bắt buộc) ====== -->
  <!-- Trục giữa -->
  <circle cx="430" cy="300" r="10" fill="none" stroke="#B8893C" stroke-width="3"/>
  <circle cx="430" cy="300" r="4" fill="#B8893C"/>

  <!-- Cung giới hạn NỬA VÒNG (180°) — quạt chỉ quét từ trên-phải xuống dưới-phải -->
  <path d="M 430 200 A 100 100 0 0 1 430 400" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.3" stroke-dasharray="4 4"/>

  <!-- KHỐI CON LẮC QUẠT — hình quạt, nằm ở vị trí giữa (đang quét) -->
  <!-- Quạt = hình cánh quạt, dày ở đầu xa trục -->
  <path d="M 430 300 L 430 210 Q 470 215 510 240 Q 520 270 510 300 Q 470 310 430 300 Z"
        fill="none" stroke="#B8893C" stroke-width="3" stroke-linejoin="round"/>
  <!-- Chi tiết bên trong quạt (gạch tạo khối) -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <line x1="460" y1="225" x2="470" y2="285"/>
    <line x1="475" y1="230" x2="485" y2="290"/>
    <line x1="490" y1="235" x2="500" y2="295"/>
  </g>

  <!-- ====== HAI CHỐT CHẶN ở hai đầu hành trình (bắt buộc) ====== -->
  <!-- Chốt chặn TRÊN (đầu hành trình phải-trên) -->
  <rect x="420" y="190" width="20" height="18" rx="3" fill="none" stroke="#FAF7F2" stroke-width="1.75"/>
  <line x1="430" y1="188" x2="430" y2="180" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Chốt chặn DƯỚI (đầu hành trình phải-dưới) -->
  <rect x="420" y="392" width="20" height="18" rx="3" fill="none" stroke="#FAF7F2" stroke-width="1.75"/>
  <line x1="430" y1="410" x2="430" y2="418" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>

  <!-- ====== CUNG MŨI TÊN HAI CHIỀU (quét qua lại) ====== -->
  <!-- Cung cong hai chiều -->
  <path d="M 520 250 Q 580 300 520 350" fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Đầu mũi tên LÊN -->
  <path d="M 515 255 L 520 245 L 528 253" fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Đầu mũi tên XUỐNG -->
  <path d="M 515 345 L 520 355 L 528 347" fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ====== GẠCH TẠO KHỐI ====== -->
  <!-- Vùng tối (dưới quạt) -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round">
    <line x1="450" y1="370" x2="490" y2="370" opacity="0.5"/>
    <line x1="450" y1="378" x2="490" y2="378" opacity="0.5"/>
    <line x1="455" y1="386" x2="485" y2="386" opacity="0.5"/>
    <line x1="460" y1="394" x2="480" y2="394" opacity="0.5"/>
  </g>
  <!-- Vùng chuyển tiếp (trên, quanh chốt chặn trên) -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round" opacity="0.3">
    <line x1="380" y="180" x2="410" y2="180"/>
    <line x1="385" y1="188" x2="415" y2="188"/>
    <line x1="390" y1="196" x2="415" y2="196"/>
  </g>
</svg>
