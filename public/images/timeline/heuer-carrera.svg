<svg viewBox="0 0 800 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Heuer Carrera 1963 — vòng phút nghiêng rìa ngoài giúp đọc nhanh khi lái</title>
  <defs>
    <pattern id="gui-heuer-carrera" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="none" stroke="#B8893C" stroke-width="0.4" opacity="0.11"/>
      <circle cx="20" cy="20" r="4" fill="none" stroke="#B8893C" stroke-width="0.3" opacity="0.11"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#B8893C" stroke-width="0.25" opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#1F2D3D"/>
  <rect width="800" height="600" fill="url(#gui-heuer-carrera)"/>

  <!-- ====== HAI ĐƯỜNG CONG GỢI KHÚC CUA (nền, mờ) ====== -->
  <path d="M 100 500 Q 250 420 400 480 Q 550 540 700 460" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.12" stroke-linecap="round"/>
  <path d="M 80 530 Q 240 460 400 510 Q 560 560 720 490" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.1" stroke-linecap="round"/>

  <!-- ====== VỔ NGOÀI ====== -->
  <circle cx="400" cy="300" r="195" fill="none" stroke="#B8893C" stroke-width="3"/>

  <!-- ====== VÒNG PHÚT TRÊN VÁT NGHIÊNG (đặc trưng Carrera) ====== -->
  <!-- Phần vát nghiêng = vành rộng hơn, vạch phút đặt sâu vào trong -->
  <circle cx="400" cy="300" r="185" fill="none" stroke="#B8893C" stroke-width="1.75" opacity="0.4"/>
  <!-- Vạch phút trên vát (60 vạch — đặt sâu vào rìa, gợi phần nghiêng) -->
  <g stroke="#B8893C" stroke-linecap="round">
    <line x1="400" y1="125" x2="400" y2="112" stroke-width="1.75"/>
    <line x1="441" y1="128" x2="443" y2="115" stroke-width="1"/>
    <line x1="481" y1="136" x2="485" y2="123" stroke-width="1"/>
    <line x1="520" y1="150" x2="526" y2="139" stroke-width="1"/>
    <line x1="555" y1="169" x2="563" y2="159" stroke-width="1.75"/>
    <line x1="587" y1="193" x2="597" y2="185" stroke-width="1"/>
    <line x1="614" y1="221" x2="625" y2="215" stroke-width="1"/>
    <line x1="635" y1="253" x2="647" y2="250" stroke-width="1"/>
    <line x1="650" y1="287" x2="662" y2="286" stroke-width="1.75"/>
    <line x1="657" y1="323" x2="669" y2="326" stroke-width="1"/>
    <line x1="656" y1="360" x2="668" y2="363" stroke-width="1"/>
    <line x1="648" y1="395" x2="660" y2="400" stroke-width="1"/>
    <line x1="634" y1="428" x2="645" y2="435" stroke-width="1.75"/>
    <line x1="614" y1="458" x2="624" y2="466" stroke-width="1"/>
    <line x1="590" y1="484" x2="599" y2="494" stroke-width="1"/>
    <line x1="562" y1="505" x2="569" y2="516" stroke-width="1"/>
    <line x1="531" y1="521" x2="536" y2="533" stroke-width="1.75"/>
    <line x1="497" y1="530" x2="501" y2="542" stroke-width="1"/>
    <line x1="463" y1="534" x2="466" y2="547" stroke-width="1"/>
    <line x1="428" y1="533" x2="429" y2="546" stroke-width="1"/>
    <line x1="400" y1="530" x2="400" y2="543" stroke-width="1.75"/>
    <line x1="359" y1="533" x2="357" y2="546" stroke-width="1"/>
    <line x1="319" y1="530" x2="315" y2="542" stroke-width="1"/>
    <line x1="280" y1="521" x2="274" y2="533" stroke-width="1.75"/>
    <line x1="245" y1="505" x2="237" y2="516" stroke-width="1"/>
    <line x1="210" y1="484" x2="201" y2="494" stroke-width="1"/>
    <line x1="186" y1="458" x2="175" y2="466" stroke-width="1.75"/>
    <line x1="166" y1="428" x2="155" y2="435" stroke-width="1"/>
    <line x1="152" y1="395" x2="140" y2="400" stroke-width="1"/>
    <line x1="144" y1="360" x2="132" y2="363" stroke-width="1.75"/>
    <line x1="143" y1="323" x2="131" y2="326" stroke-width="1"/>
    <line x1="150" y1="287" x2="138" y2="286" stroke-width="1.75"/>
    <line x1="165" y1="253" x2="153" y2="250" stroke-width="1"/>
    <line x1="186" y1="221" x2="175" y2="215" stroke-width="1"/>
    <line x1="213" y1="193" x2="203" y2="185" stroke-width="1.75"/>
    <line x1="245" y1="169" x2="237" y2="159" stroke-width="1"/>
    <line x1="280" y1="150" x2="274" y2="139" stroke-width="1"/>
    <line x1="319" y1="136" x2="315" y2="123" stroke-width="1.75"/>
  </g>

  <!-- Mặt số trong -->
  <circle cx="400" cy="300" r="140" fill="none" stroke="#B8893C" stroke-width="1.75"/>

  <!-- ====== HAI MẮT PHỤ (3 giờ và 9 giờ) ====== -->
  <!-- Mắt phụ phải -->
  <circle cx="460" cy="300" r="34" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <line x1="460" y1="270" x2="460" y2="274" stroke="#B8893C" stroke-width="1"/>
  <line x1="490" y1="300" x2="486" y2="300" stroke="#B8893C" stroke-width="1"/>
  <line x1="460" y1="330" x2="460" y2="326" stroke="#B8893C" stroke-width="1"/>
  <line x1="430" y1="300" x2="434" y2="300" stroke="#B8893C" stroke-width="1"/>
  <line x1="460" y1="300" x2="445" y2="285" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <circle cx="460" cy="300" r="3" fill="#FAF7F2"/>

  <!-- Mắt phụ trái -->
  <circle cx="340" cy="300" r="34" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <line x1="340" y1="270" x2="340" y2="274" stroke="#B8893C" stroke-width="1"/>
  <line x1="370" y1="300" x2="366" y2="300" stroke="#B8893C" stroke-width="1"/>
  <line x1="340" y1="330" x2="340" y2="326" stroke="#B8893C" stroke-width="1"/>
  <line x1="310" y1="300" x2="314" y2="300" stroke="#B8893C" stroke-width="1"/>
  <line x1="340" y1="300" x2="340" y2="275" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <circle cx="340" cy="300" r="3" fill="#FAF7F2"/>

  <!-- ====== KIM MẢNH DÀI (đọc nhanh khi lái) ====== -->
  <line x1="400" y1="300" x2="400" y2="185" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="400" y1="300" x2="470" y2="210" stroke="#FAF7F2" stroke-width="1" stroke-linecap="round"/>
  <circle cx="400" cy="300" r="4" fill="#FAF7F2"/>

  <!-- ====== GẠCH TẠO KHỐI ====== -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round">
    <line x1="350" y1="420" x2="450" y2="420" opacity="0.4"/>
    <line x1="345" y1="430" x2="455" y2="430" opacity="0.4"/>
    <line x1="350" y1="440" x2="450" y2="440" opacity="0.4"/>
  </g>
</svg>
