<svg viewBox="0 0 800 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Heuer Carrera 1963 — cận cảnh vòng chia phút trên phần vát nghiêng</title>
  <defs>
    <pattern id="gui-heuer-carrera" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="none" stroke="#B8893C" stroke-width="0.4" opacity="0.11"/>
      <circle cx="20" cy="20" r="4" fill="none" stroke="#B8893C" stroke-width="0.3" opacity="0.11"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#B8893C" stroke-width="0.25" opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#1F2D3D"/>
  <rect width="800" height="600" fill="url(#gui-heuer-carrera)"/>

  <!-- ====== HAI ĐƯỜNG CONG GỢI KHÚC CUA (nền, mờ) ====== -->
  <path d="M 80 540 Q 240 470 400 520 Q 560 570 720 500" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.12" stroke-linecap="round"/>
  <path d="M 60 560 Q 230 490 400 540 Q 570 580 740 520" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.1" stroke-linecap="round"/>

  <!-- ====== CẬN CẢNH NGHIÊNG VÀO PHẦN VÁT MẶT SỐ ====== -->
  <!-- Vỏ ngoài — elip lớn vì nhìn nghiêng từ trên xuống rìa -->
  <ellipse cx="400" cy="300" rx="320" ry="200" fill="none" stroke="#B8893C" stroke-width="3"/>

  <!-- Phần VÁT NGHIÊNG (recessed flange) — vành hẹp hơn, thấy rõ bậc -->
  <ellipse cx="400" cy="300" rx="295" ry="180" fill="none" stroke="#B8893C" stroke-width="1.75" opacity="0.5"/>
  <!-- Đường phân cách vát (gọi rõ phần nghiêng) -->
  <ellipse cx="400" cy="300" rx="255" ry="150" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.35"/>

  <!-- ====== VÒNG CHIA PHÚT TRÊN VÁT (đặc trưng Carrera — đặt trên phần nghiêng) ====== -->
  <!-- Vạch phút dày đặc trên phần vát, vòng trên cung elip phía trên -->
  <g stroke="#B8893C" stroke-linecap="round">
    <!-- Vạch lớn mỗi 5 phút (12 vạch lớn) -->
    <line x1="400" y1="120" x2="400" y2="108" stroke-width="1.75"/>
    <line x1="485" y1="128" x2="488" y2="116" stroke-width="1.75"/>
    <line x1="565" y1="150" x2="572" y2="140" stroke-width="1.75"/>
    <line x1="635" y1="190" x2="646" y2="183" stroke-width="1.75"/>
    <line x1="690" y1="248" x2="703" y2="245" stroke-width="1.75"/>
    <line x1="720" y1="318" x2="733" y2="320" stroke-width="1.75"/>
    <line x1="710" y1="385" x2="722" y2="390" stroke-width="1.75"/>
    <line x1="660" y1="440" x2="669" y2="449" stroke-width="1.75"/>
    <line x1="400" y1="480" x2="400" y2="492" stroke-width="1.75"/>
    <line x1="315" y1="128" x2="312" y2="116" stroke-width="1.75"/>
    <line x1="235" y1="150" x2="228" y2="140" stroke-width="1.75"/>
    <line x1="165" y1="190" x2="154" y2="183" stroke-width="1.75"/>
    <line x1="110" y1="248" x2="97" y2="245" stroke-width="1.75"/>
    <line x1="80" y1="318" x2="67" y2="320" stroke-width="1.75"/>
    <line x1="90" y1="385" x2="78" y2="390" stroke-width="1.75"/>
    <line x1="140" y1="440" x2="131" y2="449" stroke-width="1.75"/>
  </g>
  <!-- Vạch nhỏ mỗi 1 phút (gạch phụ giữa các vạch lớn, phía trên) -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round">
    <line x1="424" y1="121" x2="425" y2="112"/>
    <line x1="450" y1="124" x2="452" y2="115"/>
    <line x1="522" y1="135" x2="525" y2="126"/>
    <line x1="552" y1="143" x2="556" y2="134"/>
    <line x1="598" y1="166" x2="604" y2="158"/>
    <line x1="617" y1="178" x2="624" y2="171"/>
    <line x1="663" y1="215" x2="672" y2="210"/>
    <line x1="678" y1="232" x2="688" y2="228"/>
    <line x1="703" y1="282" x2="715" y2="281"/>
    <line x1="708" y1="306" x2="720" y2="307"/>
  </g>

  <!-- ====== HAI MẮT PHỤ (ở giữa mặt số trong) ====== -->
  <circle cx="460" cy="300" r="38" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <line x1="460" y1="268" x2="460" y2="272" stroke="#B8893C" stroke-width="1"/>
  <line x1="492" y1="300" x2="488" y2="300" stroke="#B8893C" stroke-width="1"/>
  <line x1="460" y1="332" x2="460" y2="328" stroke="#B8893C" stroke-width="1"/>
  <line x1="428" y1="300" x2="432" y2="300" stroke="#B8893C" stroke-width="1"/>
  <line x1="460" y1="300" x2="445" y2="282" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <circle cx="460" cy="300" r="3" fill="#FAF7F2"/>

  <circle cx="340" cy="300" r="38" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <line x1="340" y1="268" x2="340" y2="272" stroke="#B8893C" stroke-width="1"/>
  <line x1="372" y1="300" x2="368" y2="300" stroke="#B8893C" stroke-width="1"/>
  <line x1="340" y1="332" x2="340" y2="328" stroke="#B8893C" stroke-width="1"/>
  <line x1="308" y1="300" x2="312" y2="300" stroke="#B8893C" stroke-width="1"/>
  <line x1="340" y1="300" x2="340" y2="275" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <circle cx="340" cy="300" r="3" fill="#FAF7F2"/>

  <!-- ====== KIM MẢNH DÀI (đọc nhanh khi lái) ====== -->
  <line x1="400" y1="300" x2="400" y2="175" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="400" y1="300" x2="478" y2="225" stroke="#FAF7F2" stroke-width="1" stroke-linecap="round"/>
  <circle cx="400" cy="300" r="5" fill="#FAF7F2"/>

  <!-- ====== GẠCH TẠO KHỐI ====== -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round">
    <line x1="280" y1="510" x2="520" y2="510" opacity="0.4"/>
    <line x1="270" y1="520" x2="530" y2="520" opacity="0.4"/>
    <line x1="275" y1="530" x2="525" y2="530" opacity="0.4"/>
  </g>
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round" opacity="0.3">
    <line x1="90" y1="500" x2="170" y2="500"/>
    <line x1="95" y1="510" x2="175" y2="510"/>
  </g>
</svg>
