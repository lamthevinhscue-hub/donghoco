<svg viewBox="0 0 800 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Dây tóc và bánh lắc — phát minh của Huygens tạo nền tảng cho mọi đồng hồ cơ</title>
  <defs>
    <pattern id="gui-huygens-hairspring" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="none" stroke="#B8893C" stroke-width="0.4" opacity="0.11"/>
      <circle cx="20" cy="20" r="4" fill="none" stroke="#B8893C" stroke-width="0.3" opacity="0.11"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#B8893C" stroke-width="0.25" opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#1F2D3D"/>
  <rect width="800" height="600" fill="url(#gui-huygens-hairspring)"/>

  <!-- 3 cung dao động — đậm hơn (opacity 0.35/0.25 thay vì 0.2/0.1) -->
  <path d="M 150 300 Q 250 230 350 300" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <path d="M 450 300 Q 550 370 650 300" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <path d="M 130 300 Q 250 200 370 300" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.25" stroke-linecap="round"/>
  <path d="M 430 300 Q 550 400 670 300" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.25" stroke-linecap="round"/>

  <!-- Vành bánh lắc tròn -->
  <ellipse cx="400" cy="320" rx="200" ry="180" fill="none" stroke="#B8893C" stroke-width="3"/>
  <ellipse cx="400" cy="320" rx="190" ry="170" fill="none" stroke="#B8893C" stroke-width="1.75" opacity="0.6"/>

  <!-- Nan chữ thập trên bánh lắc -->
  <line x1="400" y1="155" x2="400" y2="485" stroke="#B8893C" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="215" y1="320" x2="585" y2="320" stroke="#B8893C" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="270" y1="205" x2="530" y2="435" stroke="#B8893C" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="530" y1="205" x2="270" y2="435" stroke="#B8893C" stroke-width="1.75" stroke-linecap="round"/>

  <!-- Vít chặn mép -->
  <circle cx="400" cy="155" r="5" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <circle cx="400" cy="485" r="5" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <circle cx="215" cy="320" r="5" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <circle cx="585" cy="320" r="5" fill="none" stroke="#B8893C" stroke-width="1.75"/>

  <!-- Gạch tạo khối: vùng tối đậm (giữa bánh lắc, góc dưới-phải) -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round">
    <line x1="460" y1="400" x2="495" y2="400" opacity="0.65"/>
    <line x1="460" y1="406" x2="495" y2="406" opacity="0.65"/>
    <line x1="460" y1="412" x2="495" y2="412" opacity="0.65"/>
    <line x1="460" y1="418" x2="490" y2="418" opacity="0.65"/>
    <line x1="460" y1="424" x2="485" y2="424" opacity="0.65"/>
    <line x1="465" y1="430" x2="480" y2="430" opacity="0.65"/>
  </g>
  <!-- Vùng chuyển tiếp thưa (góc trên-trái) -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round" opacity="0.35">
    <line x1="310" y1="220" x2="335" y2="220"/>
    <line x1="310" y1="230" x2="335" y2="230"/>
    <line x1="315" y1="240" x2="335" y2="240"/>
  </g>

  <!-- Dây tóc xoắn ốc — 12 vòng đồng tâm -->
  <ellipse cx="400" cy="320" rx="150" ry="135" fill="none" stroke="#FAF7F2" stroke-width="1.75"/>
  <ellipse cx="400" cy="320" rx="138" ry="124" fill="none" stroke="#FAF7F2" stroke-width="1.75"/>
  <ellipse cx="400" cy="320" rx="126" ry="113" fill="none" stroke="#FAF7F2" stroke-width="1.75"/>
  <ellipse cx="400" cy="320" rx="114" ry="102" fill="none" stroke="#FAF7F2" stroke-width="1.75"/>
  <ellipse cx="400" cy="320" rx="102" ry="91" fill="none" stroke="#FAF7F2" stroke-width="1.75"/>
  <ellipse cx="400" cy="320" rx="90" ry="80" fill="none" stroke="#FAF7F2" stroke-width="1.75"/>
  <ellipse cx="400" cy="320" rx="78" ry="69" fill="none" stroke="#FAF7F2" stroke-width="1.75"/>
  <ellipse cx="400" cy="320" rx="66" ry="58" fill="none" stroke="#FAF7F2" stroke-width="1.75"/>
  <ellipse cx="400" cy="320" rx="54" ry="47" fill="none" stroke="#FAF7F2" stroke-width="1.75"/>
  <ellipse cx="400" cy="320" rx="42" ry="36" fill="none" stroke="#FAF7F2" stroke-width="1.75"/>
  <ellipse cx="400" cy="320" rx="30" ry="25" fill="none" stroke="#FAF7F2" stroke-width="1.75"/>
  <ellipse cx="400" cy="320" rx="18" ry="14" fill="none" stroke="#FAF7F2" stroke-width="1.75"/>

  <circle cx="400" cy="320" r="8" fill="none" stroke="#FAF7F2" stroke-width="3"/>
  <circle cx="400" cy="320" r="3" fill="#FAF7F2"/>
</svg>
