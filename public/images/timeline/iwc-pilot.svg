  <!-- ====== TAM GIÁC ĐỊNH HƯỚNG Ở 12 GIỜ (có 2 chấm hai bên) ====== -->
  <!-- Tam giác lớn chỉ 12 giờ (đặc trưng pilot) -->
  <path d="M 400 130 L 420 165 L 380 165 Z" fill="none" stroke="#FAF7F2" stroke-width="3" stroke-linejoin="round"/>
  <!-- 2 chấm hai bên tam giác -->
  <circle cx="365" cy="165" r="5" fill="#FAF7F2"/>
  <circle cx="435" cy="165" r="5" fill="#FAF7F2"/>

  <!-- ====== CỌC SỐ Ả RẬP CỠ LỚN (vẽ bằng path) ====== -->
  <!-- 3 (phải) -->
  <g stroke="#FAF7F2" stroke-width="1.75" fill="none" stroke-linecap="round">
    <path d="M 555 280 L 555 300"/>
    <path d="M 545 280 L 545 300"/>
    <path d="M 565 280 L 565 300"/>
  </g>
  <!-- 6 (dưới) -->
  <g stroke="#FAF7F2" stroke-width="1.75" fill="none" stroke-linecap="round">
    <path d="M 390 440 L 400 455 L 410 440"/>
    <path d="M 410 438 L 410 455"/>
