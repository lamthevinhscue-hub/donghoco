<svg viewBox="0 0 800 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Bộ thoát Co-Axial của Omega 1999 — hai bánh thoát đồng trục giảm ma sát</title>
  <defs>
    <pattern id="gui-omega-coaxial" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="none" stroke="#B8893C" stroke-width="0.4" opacity="0.11"/>
      <circle cx="20" cy="20" r="4" fill="none" stroke="#B8893C" stroke-width="0.3" opacity="0.11"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#B8893C" stroke-width="0.25" opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#1F2D3D"/>
  <rect width="800" height="600" fill="url(#gui-omega-coaxial)"/>

  <!-- ====== HAI BÁNH THOÁT XẾP CHỒNG ĐỒNG TRỤC (đặc trưng bắt buộc) ====== -->
  <!-- Bánh thoát dưới (lớn hơn) — có răng -->
  <circle cx="400" cy="300" r="90" fill="none" stroke="#B8893C" stroke-width="3"/>
  <g stroke="#B8893C" stroke-width="1.75" stroke-linecap="round">
    <line x1="400" y1="210" x2="400" y2="200"/>
    <line x1="432" y1="214" x2="434" y2="205"/>
    <line x1="462" y1="224" x2="467" y2="216"/>
    <line x1="486" y1="242" x2="493" y2="236"/>
    <line x1="504" y1="266" x2="512" y2="262"/>
    <line x1="513" y1="294" x2="522" y2="293"/>
    <line x1="513" y1="306" x2="522" y2="307"/>
    <line x1="504" y1="334" x2="512" y2="338"/>
    <line x1="486" y1="358" x2="493" y2="364"/>
    <line x1="462" y1="376" x2="467" y2="384"/>
    <line x1="432" y1="386" x2="434" y2="395"/>
    <line x1="400" y1="390" x2="400" y2="400"/>
    <line x1="368" y1="386" x2="366" y2="395"/>
    <line x1="338" y1="376" x2="333" y2="384"/>
    <line x1="314" y1="358" x2="307" y2="364"/>
    <line x1="296" y1="334" x2="288" y2="338"/>
    <line x1="287" y1="306" x2="278" y2="307"/>
    <line x1="287" y1="294" x2="278" y2="293"/>
    <line x1="296" y1="266" x2="288" y2="262"/>
    <line x1="314" y1="242" x2="307" y2="236"/>
    <line x1="338" y1="224" x2="333" y2="216"/>
    <line x1="368" y1="214" x2="366" y2="205"/>
  </g>

  <!-- Bánh thoát trên (nhỏ hơn — xếp chồng đồng trục, lệch nhẹ) -->
  <circle cx="400" cy="295" r="60" fill="none" stroke="#FAF7F2" stroke-width="3"/>
  <g stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round">
    <line x1="400" y1="235" x2="400" y2="228"/>
    <line x1="423" y1="239" x2="425" y2="233"/>
    <line x1="443" y1="252" x2="447" y2="247"/>
    <line x1="456" y1="272" x2="461" y2="270"/>
    <line x1="460" y1="295" x2="465" y2="295"/>
    <line x1="456" y1="318" x2="461" y2="320"/>
    <line x1="443" y1="338" x2="447" y2="343"/>
    <line x1="423" y1="351" x2="425" y2="357"/>
    <line x1="400" y1="355" x2="400" y2="362"/>
    <line x1="377" y1="351" x2="375" y2="357"/>
    <line x1="357" y1="338" x2="353" y2="343"/>
    <line x1="344" y1="318" x2="339" y2="320"/>
    <line x1="340" y1="295" x2="335" y2="295"/>
    <line x1="344" y1="272" x2="339" y2="270"/>
    <line x1="357" y1="252" x2="353" y2="247"/>
    <line x1="377" y1="239" x2="375" y2="233"/>
  </g>

  <!-- Trục đồng trục (chung — đặc trưng) -->
  <circle cx="400" cy="298" r="8" fill="none" stroke="#FAF7F2" stroke-width="3"/>
  <circle cx="400" cy="298" r="3" fill="#FAF7F2"/>

  <!-- ====== NGỰA (pallet fork) + 3 VIÊN ĐÁ ====== -->
  <g transform="translate(400 420)">
    <!-- Thân ngựa -->
    <path d="M 0 0 L -30 -20 L -35 -25 M 0 0 L 30 -20 L 35 -25 M 0 0 L 0 25"
          fill="none" stroke="#B8893C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 3 viên đá (palette jewels) -->
    <rect x="-37" y="-28" width="4" height="4" fill="#FAF7F2" transform="rotate(-20 -35 -26)"/>
    <rect x="33" y="-28" width="4" height="4" fill="#FAF7F2" transform="rotate(20 35 -26)"/>
    <rect x="-2" y="22" width="4" height="4" fill="#FAF7F2"/>
    <circle cx="0" cy="0" r="3" fill="#B8893C"/>
  </g>

  <!-- ====== MŨI TÊN CHỈ HƯỚNG TRUYỀN LỰC ====== -->
  <path d="M 200 300 L 280 300" fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <path d="M 275 295 L 285 300 L 275 305" fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Mũi tên lực tầng 2 -->
  <path d="M 200 270 L 270 275" fill="none" stroke="#FAF7F2" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <path d="M 265 271 L 275 275 L 268 280" fill="none" stroke="#FAF7F2" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="0.5"/>

  <!-- ====== KHUNG ĐỐI CHIẾU: BỘ THOÁT TRUYỀN THỐNG MỘT TẦNG (góc dưới-phải) ====== -->
  <rect x="600" y="430" width="160" height="120" rx="6" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <!-- Bánh thoát 1 tầng (nhỏ) -->
  <circle cx="660" cy="490" r="30" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round">
    <line x1="660" y1="460" x2="660" y2="455"/>
    <line x1="678" y1="472" x2="681" y2="469"/>
    <line x1="660" y1="520" x2="660" y2="525"/>
    <line x1="642" y1="508" x2="639" y2="511"/>
    <line x1="690" y1="490" x2="695" y2="490"/>
    <line x1="630" y1="490" x2="625" y2="490"/>
  </g>
  <!-- Ngựa đơn giản -->
  <path d="M 710 485 L 720 478 M 710 485 L 720 492 M 710 485 L 715 498" fill="none" stroke="#B8893C" stroke-width="1" stroke-linecap="round"/>
  <circle cx="710" cy="485" r="2" fill="#B8893C"/>

  <!-- ====== GẠCH TẠO KHỐI ====== -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round">
    <line x1="460" y1="450" x2="520" y2="450" opacity="0.4"/>
    <line x1="460" y1="458" x2="520" y2="458" opacity="0.4"/>
    <line x1="465" y1="466" x2="515" y2="466" opacity="0.4"/>
  </g>
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round" opacity="0.3">
    <line x1="150" y1="200" x2="190" y2="200"/>
    <line x1="155" y1="210" x2="195" y2="210"/>
  </g>
</svg>
