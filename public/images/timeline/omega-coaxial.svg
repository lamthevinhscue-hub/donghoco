<svg viewBox="0 0 800 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Bộ thoát Co-Axial của Omega 1999 — bố cục đôi so sánh truyền thống và đồng trục</title>
  <defs>
    <pattern id="gui-omega-coaxial" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="none" stroke="#B8893C" stroke-width="0.4" opacity="0.11"/>
      <circle cx="20" cy="20" r="4" fill="none" stroke="#B8893C" stroke-width="0.3" opacity="0.11"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#B8893C" stroke-width="0.25" opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#1F2D3D"/>
  <rect width="800" height="600" fill="url(#gui-omega-coaxial)"/>

  <!-- ====== ĐƯỜNG PHÂN CÁCH DỌC GIỮA HAI NỬA ====== -->
  <line x1="400" y1="60" x2="400" y2="540" stroke="#FAF7F2" stroke-width="0.75" stroke-dasharray="8 6" opacity="0.4"/>

  <!-- ====== NỬA TRÁI: BỘ THOÁT TRUYỀN THỐNG MỘT TẦNG ====== -->
  <!-- Nhãn vùng (gợi bằng nét, không thẻ text) -->
  <g stroke="#FAF7F2" stroke-width="0.75" opacity="0.4" stroke-linecap="round">
    <line x1="120" y1="100" x2="280" y2="100"/>
    <line x1="130" y1="108" x2="270" y2="108"/>
  </g>

  <!-- Bánh thoát 1 TẦNG (một lớp) -->
  <circle cx="200" cy="300" r="85" fill="none" stroke="#B8893C" stroke-width="3"/>
  <!-- Răng (1 lớp) -->
  <g stroke="#B8893C" stroke-width="1.75" stroke-linecap="round">
    <line x1="200" y1="215" x2="200" y2="205"/>
    <line x1="228" y1="219" x2="230" y2="210"/>
    <line x1="254" y1="229" x2="259" y2="221"/>
    <line x1="275" y1="247" x2="282" y2="241"/>
    <line x1="289" y1="271" x2="298" y2="268"/>
    <line x1="294" y1="298" x2="303" y2="298"/>
    <line x1="289" y1="325" x2="298" y2="328"/>
    <line x1="275" y1="349" x2="282" y2="355"/>
    <line x1="254" y1="367" x2="259" y2="375"/>
    <line x1="228" y1="377" x2="230" y2="386"/>
    <line x1="200" y1="385" x2="200" y2="395"/>
    <line x1="172" y1="377" x2="170" y2="386"/>
    <line x1="146" y1="367" x2="141" y2="375"/>
    <line x1="125" y1="349" x2="118" y2="355"/>
    <line x1="111" y1="325" x2="102" y2="328"/>
    <line x1="106" y1="298" x2="97" y2="298"/>
    <line x1="111" y1="271" x2="102" y2="268"/>
    <line x1="125" y1="247" x2="118" y2="241"/>
    <line x1="146" y1="229" x2="141" y2="221"/>
    <line x1="172" y1="219" x2="170" y2="210"/>
  </g>
  <!-- Trục -->
  <circle cx="200" cy="300" r="7" fill="none" stroke="#FAF7F2" stroke-width="1.75"/>
  <circle cx="200" cy="300" r="3" fill="#FAF7F2"/>

  <!-- Ngựa + 2 viên đá (truyền thống 2 viên) -->
  <g transform="translate(200 410)">
    <path d="M 0 0 L -26 -18 L -30 -22 M 0 0 L 26 -18 L 30 -22 M 0 0 L 0 22"
          fill="none" stroke="#B8893C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-32" y="-25" width="4" height="4" fill="#FAF7F2" transform="rotate(-20 -30 -23)"/>
    <rect x="28" y="-25" width="4" height="4" fill="#FAF7F2" transform="rotate(20 30 -23)"/>
    <circle cx="0" cy="0" r="3" fill="#B8893C"/>
  </g>
  <!-- Dấu chấm dầu (gợi dầu bôi trơn ma sát) -->
  <ellipse cx="170" cy="385" rx="8" ry="4" fill="#B8893C" opacity="0.35"/>
  <ellipse cx="230" cy="385" rx="8" ry="4" fill="#B8893C" opacity="0.35"/>

  <!-- ====== NỬA PHẢI: BỘ THOÁT ĐỒNG TRỤC HAI TẦNG ====== -->
  <g stroke="#FAF7F2" stroke-width="0.75" opacity="0.4" stroke-linecap="round">
    <line x1="520" y1="100" x2="680" y2="100"/>
    <line x1="530" y1="108" x2="670" y2="108"/>
  </g>

  <!-- Bánh thoát dưới (lớn hơn) — TẦNG 1 -->
  <circle cx="600" cy="300" r="85" fill="none" stroke="#B8893C" stroke-width="3"/>
  <g stroke="#B8893C" stroke-width="1.75" stroke-linecap="round">
    <line x1="600" y1="215" x2="600" y2="205"/>
    <line x1="628" y1="219" x2="630" y2="210"/>
    <line x1="654" y1="229" x2="659" y2="221"/>
    <line x1="675" y1="247" x2="682" y2="241"/>
    <line x1="689" y1="271" x2="698" y2="268"/>
    <line x1="694" y1="298" x2="703" y2="298"/>
    <line x1="689" y1="325" x2="698" y2="328"/>
    <line x1="675" y1="349" x2="682" y2="355"/>
    <line x1="654" y1="367" x2="659" y2="375"/>
    <line x1="628" y1="377" x2="630" y2="386"/>
    <line x1="600" y1="385" x2="600" y2="395"/>
    <line x1="572" y1="377" x2="570" y2="386"/>
    <line x1="546" y1="367" x2="541" y2="375"/>
    <line x1="525" y1="349" x2="518" y2="355"/>
    <line x1="511" y1="325" x2="502" y2="328"/>
    <line x1="506" y1="298" x2="497" y2="298"/>
    <line x1="511" y1="271" x2="502" y2="268"/>
    <line x1="525" y1="247" x2="518" y2="241"/>
    <line x1="546" y1="229" x2="541" y2="221"/>
    <line x1="572" y1="219" x2="570" y2="210"/>
  </g>

  <!-- Bánh thoát trên (nhỏ hơn) — TẦNG 2 xếp chồng đồng trục (đặc trưng) -->
  <circle cx="600" cy="295" r="55" fill="none" stroke="#FAF7F2" stroke-width="3"/>
  <g stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round">
    <line x1="600" y1="240" x2="600" y2="233"/>
    <line x1="621" y1="244" x2="623" y2="238"/>
    <line x1="640" y1="254" x2="644" y2="249"/>
    <line x1="652" y1="272" x2="657" y2="270"/>
    <line x1="655" y1="295" x2="660" y2="295"/>
    <line x1="652" y1="318" x2="657" y2="320"/>
    <line x1="640" y1="336" x2="644" y2="341"/>
    <line x1="621" y1="346" x2="623" y2="352"/>
    <line x1="600" y1="350" x2="600" y2="357"/>
    <line x1="579" y1="346" x2="577" y2="352"/>
    <line x1="560" y1="336" x2="556" y2="341"/>
    <line x1="548" y1="318" x2="543" y2="320"/>
    <line x1="545" y1="295" x2="540" y2="295"/>
    <line x1="548" y1="272" x2="543" y2="270"/>
    <line x1="560" y1="254" x2="556" y2="249"/>
    <line x1="579" y1="244" x2="577" y2="238"/>
  </g>

  <!-- Trục đồng trục (chung — đặc trưng) -->
  <circle cx="600" cy="298" r="8" fill="none" stroke="#FAF7F2" stroke-width="3"/>
  <circle cx="600" cy="298" r="3" fill="#FAF7F2"/>

  <!-- Ngựa + 3 viên đá (đồng trục đặc trưng 3 viên) -->
  <g transform="translate(600 410)">
    <path d="M 0 0 L -30 -20 L -34 -25 M 0 0 L 30 -20 L 34 -25 M 0 0 L 0 25"
          fill="none" stroke="#B8893C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-36" y="-28" width="4" height="4" fill="#FAF7F2" transform="rotate(-20 -34 -26)"/>
    <rect x="32" y="-28" width="4" height="4" fill="#FAF7F2" transform="rotate(20 34 -26)"/>
    <rect x="-2" y="22" width="4" height="4" fill="#FAF7F2"/>
    <circle cx="0" cy="0" r="3" fill="#B8893C"/>
  </g>

  <!-- Mũi tên chỉ hướng truyền lực (đẩy gần thẳng góc) -->
  <path d="M 740 290 L 720 295" fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <path d="M 725 290 L 715 295 L 724 300" fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ====== GẠCH TẠO KHỐI ====== -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round">
    <line x1="120" y1="490" x2="280" y2="490" opacity="0.4"/>
    <line x1="115" y1="500" x2="285" y2="500" opacity="0.4"/>
    <line x1="120" y1="510" x2="280" y2="510" opacity="0.4"/>
  </g>
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round">
    <line x1="520" y1="490" x2="680" y2="490" opacity="0.4"/>
    <line x1="515" y1="500" x2="685" y2="500" opacity="0.4"/>
    <line x1="520" y1="510" x2="680" y2="510" opacity="0.4"/>
  </g>
</svg>
