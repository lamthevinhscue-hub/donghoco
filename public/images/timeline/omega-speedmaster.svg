<svg viewBox="0 0 800 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Omega Speedmaster 1957 — chronograph ba mắt phụ với vành tachymeter</title>
  <defs>
    <pattern id="gui-omega-speedmaster" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="none" stroke="#B8893C" stroke-width="0.4" opacity="0.11"/>
      <circle cx="20" cy="20" r="4" fill="none" stroke="#B8893C" stroke-width="0.3" opacity="0.11"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#B8893C" stroke-width="0.25" opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#1F2D3D"/>
  <rect width="800" height="600" fill="url(#gui-omega-speedmaster)"/>

  <!-- ====== VÀNH TRĂNG KHUYẾT MỜ (nền — gợi không gian) ====== -->
  <circle cx="660" cy="140" r="80" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.08"/>
  <path d="M 580 140 A 80 80 0 0 1 720 140" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.12"/>
  <!-- Vết trăng khuyết -->
  <path d="M 620 110 A 50 50 0 0 1 690 180" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.1"/>

  <!-- ====== VỔ ====== -->
  <circle cx="400" cy="300" r="200" fill="none" stroke="#B8893C" stroke-width="3"/>
  <circle cx="400" cy="300" r="188" fill="none" stroke="#B8893C" stroke-width="1.75" opacity="0.5"/>

  <!-- ====== VÀNH TACHYMETER — VẠCH CHIA THỦA DẦN (không đều) ====== -->
  <!-- Bán kính vành: 188-170. Vạch dày ở đầu (60), thưa dần về cuối (500) -->
  <!-- Vạch ở các góc — dày ở dưới-phải (tốc độ thấp), thưa ở trên-trái (tốc độ cao) -->
  <g stroke="#B8893C" stroke-linecap="round">
    <!-- 60 (dưới, vạch lớn) -->
    <line x1="400" y1="488" x2="400" y2="498" stroke-width="1.75"/>
    <!-- 75 -->
    <line x1="445" y1="484" x2="447" y2="494" stroke-width="1"/>
    <!-- 80 -->
    <line x1="460" y1="481" x2="463" y2="491" stroke-width="1"/>
    <!-- 90 -->
    <line x1="490" y1="473" x2="495" y2="482" stroke-width="1"/>
    <!-- 100 -->
    <line x1="515" y1="462" x2="521" y2="470" stroke-width="1.75"/>
    <!-- 120 -->
    <line x1="550" y1="440" x2="558" y2="447" stroke-width="1"/>
    <!-- 140 (thưa dần) -->
    <line x1="575" y1="415" x2="584" y2="421" stroke-width="1"/>
    <!-- 160 -->
    <line x1="595" y1="388" x2="605" y2="392" stroke-width="1"/>
    <!-- 180 -->
    <line x1="612" y1="358" x2="622" y2="360" stroke-width="1.75"/>
    <!-- 200 -->
    <line x1="625" y1="325" x2="635" y2="326" stroke-width="1"/>
    <!-- 240 (rất thưa) -->
    <line x1="638" y1="280" x2="648" y2="279" stroke-width="1"/>
    <!-- 300 -->
    <line x1="642" y1="230" x2="652" y2="227" stroke-width="1.75"/>
    <!-- 400 (cực thưa) -->
    <line x1="635" y1="180" x2="644" y2="176" stroke-width="1"/>
    <!-- 500 (cuối thang) -->
    <line x1="620" y1="145" x2="628" y2="140" stroke-width="1.75"/>

    <!-- Nửa đối xứng (trái) — cũng thưa dần -->
    <line x1="355" y1="484" x2="353" y2="494" stroke-width="1"/>
    <line x1="310" y1="473" x2="305" y2="482" stroke-width="1"/>
    <line x1="285" y1="462" x2="279" y2="470" stroke-width="1.75"/>
    <line x1="250" y1="440" x2="242" y2="447" stroke-width="1"/>
    <line x1="225" y1="415" x2="216" y2="421" stroke-width="1"/>
    <line x1="188" y1="358" x2="178" y2="360" stroke-width="1.75"/>
    <line x1="162" y1="280" x2="152" y2="279" stroke-width="1"/>
    <line x1="158" y1="230" x2="148" y2="227" stroke-width="1.75"/>
    <line x1="165" y1="180" x2="156" y2="176" stroke-width="1"/>
  </g>

  <!-- ====== BA MẮT PHỤ TRÒN ĐỐI XỨNG (đặc trưng chronograph) ====== -->
  <!-- Mắt phụ trên (12 giờ — giờ chronograph) -->
  <circle cx="400" cy="230" r="42" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <circle cx="400" cy="230" r="36" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.4"/>
  <!-- Vạch mắt phụ trên -->
  <line x1="400" y1="194" x2="400" y2="200" stroke="#B8893C" stroke-width="1"/>
  <line x1="436" y1="230" x2="430" y2="230" stroke="#B8893C" stroke-width="1"/>
  <line x1="400" y1="266" x2="400" y2="260" stroke="#B8893C" stroke-width="1"/>
  <line x1="364" y1="230" x2="370" y2="230" stroke="#B8893C" stroke-width="1"/>
  <!-- Kim mắt phụ trên -->
  <line x1="400" y1="230" x2="415" y2="210" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <circle cx="400" cy="230" r="3" fill="#FAF7F2"/>

  <!-- Mắt phụ trái (9 giờ — giây chạy) -->
  <circle cx="330" cy="300" r="42" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <circle cx="330" cy="300" r="36" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.4"/>
  <line x1="330" y1="264" x2="330" y2="270" stroke="#B8893C" stroke-width="1"/>
  <line x1="366" y1="300" x2="360" y2="300" stroke="#B8893C" stroke-width="1"/>
  <line x1="330" y1="336" x2="330" y2="330" stroke="#B8893C" stroke-width="1"/>
  <line x1="294" y1="300" x2="300" y2="300" stroke="#B8893C" stroke-width="1"/>
  <line x1="330" y1="300" x2="330" y2="275" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <circle cx="330" cy="300" r="3" fill="#FAF7F2"/>

  <!-- Mắt phụ phải (3 giờ — phút chronograph) -->
  <circle cx="470" cy="300" r="42" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <circle cx="470" cy="300" r="36" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.4"/>
  <line x1="470" y1="264" x2="470" y2="270" stroke="#B8893C" stroke-width="1"/>
  <line x1="506" y1="300" x2="500" y2="300" stroke="#B8893C" stroke-width="1"/>
  <line x1="470" y1="336" x2="470" y2="330" stroke="#B8893C" stroke-width="1"/>
  <line x1="434" y1="300" x2="440" y2="300" stroke="#B8893C" stroke-width="1"/>
  <line x1="470" y1="300" x2="450" y2="285" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <circle cx="470" cy="300" r="3" fill="#FAF7F2"/>

  <!-- ====== KIM GIỜ + KIM PHÚT CHÍNH ====== -->
  <line x1="400" y1="300" x2="400" y2="180" stroke="#FAF7F2" stroke-width="3" stroke-linecap="round"/>
  <line x1="400" y1="300" x2="470" y2="200" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <circle cx="400" cy="300" r="5" fill="#FAF7F2"/>

  <!-- ====== HAI NÚT BẤM (hai bên núm vặn — đặc trưng chronograph) ====== -->
  <!-- Nút bấm trên (2 giờ) -->
  <rect x="585" y="195" width="16" height="22" rx="3" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <!-- Nút vặn (giữa) -->
  <rect x="598" y="270" width="20" height="30" rx="4" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <!-- Nút bấm dưới (4 giờ) -->
  <rect x="585" y="365" width="16" height="22" rx="3" fill="none" stroke="#B8893C" stroke-width="1.75"/>

  <!-- ====== GẠCH TẠO KHỐI ====== -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round">
    <line x1="350" y1="420" x2="450" y2="420" opacity="0.4"/>
    <line x1="345" y1="430" x2="455" y2="430" opacity="0.4"/>
    <line x1="350" y1="440" x2="450" y2="440" opacity="0.4"/>
    <line x1="355" y1="450" x2="445" y2="450" opacity="0.4"/>
  </g>
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round" opacity="0.3">
    <line x1="200" y1="190" x2="240" y2="190"/>
    <line x1="205" y1="200" x2="245" y2="200"/>
  </g>
</svg>
