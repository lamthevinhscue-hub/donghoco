<svg viewBox="0 0 800 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Đồng hồ đeo tay đầu tiên của Patek Philippe — trang sức nữ 1868</title>
  <defs>
    <pattern id="gui-patek-first-wristwatch" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="none" stroke="#B8893C" stroke-width="0.4" opacity="0.11"/>
      <circle cx="20" cy="20" r="4" fill="none" stroke="#B8893C" stroke-width="0.3" opacity="0.11"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#B8893C" stroke-width="0.25" opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#1F2D3D"/>
  <rect width="800" height="600" fill="url(#gui-patek-first-wristwatch)"/>

  <!-- ====== VÒNG ĐEO LẮC KIM LOẠI BẢN TO (đặc trưng — chiếm visual chính) ====== -->
  <!-- Lắc trái — bản to có hoa văn -->
  <path d="M 250 180 Q 280 150 350 180" fill="none" stroke="#B8893C" stroke-width="3" stroke-linecap="round"/>
  <path d="M 255 195 Q 285 168 350 195" fill="none" stroke="#B8893C" stroke-width="1.75" opacity="0.5"/>
  <!-- Hoa văn trên lắc (gạch chéo) -->
  <g stroke="#B8893C" stroke-width="1" opacity="0.4">
    <line x1="265" y1="178" x2="272" y2="190"/>
    <line x1="280" y1="170" x2="287" y2="182"/>
    <line x1="295" y1="165" x2="302" y2="177"/>
    <line x1="310" y1="163" x2="317" y2="175"/>
    <line x1="325" y1="165" x2="332" y2="177"/>
    <line x1="340" y1="170" x2="347" y2="182"/>
  </g>

  <!-- Lắc phải -->
  <path d="M 450 180 Q 520 150 550 180" fill="none" stroke="#B8893C" stroke-width="3" stroke-linecap="round"/>
  <path d="M 450 195 Q 515 168 545 195" fill="none" stroke="#B8893C" stroke-width="1.75" opacity="0.5"/>
  <g stroke="#B8893C" stroke-width="1" opacity="0.4">
    <line x1="460" y1="170" x2="467" y2="182"/>
    <line x1="475" y1="165" x2="482" y2="177"/>
    <line x1="490" y1="163" x2="497" y2="175"/>
    <line x1="505" y1="165" x2="512" y2="177"/>
    <line x1="520" y1="170" x2="527" y2="182"/>
    <line x1="535" y1="178" x2="542" y2="190"/>
  </g>

  <!-- ====== VỎ CHỮ NHẬT NHỎ (trang sức — nhỏ hơn dây đeo!) ====== -->
  <rect x="345" y="230" width="110" height="90" rx="8" fill="none" stroke="#B8893C" stroke-width="3" stroke-linejoin="round"/>
  <!-- Viền trong -->
  <rect x="352" y="237" width="96" height="76" rx="5" fill="none" stroke="#B8893C" stroke-width="1.75" opacity="0.5"/>

  <!-- Mặt số (đơn giản — trang sức không cần mặt số chi tiết) -->
  <rect x="360" y="245" width="80" height="60" rx="3" fill="none" stroke="#B8893C" stroke-width="1"/>
  <!-- Kim nhỏ -->
  <line x1="400" y1="275" x2="400" y2="258" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="400" y1="275" x2="420" y2="268" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <circle cx="400" cy="275" r="3" fill="#FAF7F2"/>

  <!-- ====== ĐÁ NÁM (vẽ thành hình kim cương nhiều mặt cắt) ====== -->
  <!-- Đá trên cùng (lớn) — kim cương nhiều mặt -->
  <path d="M 380 195 L 420 195 L 435 215 L 400 240 L 365 215 Z" fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linejoin="round"/>
  <!-- Mặt cắt kim cương -->
  <line x1="380" y1="195" x2="400" y2="240" stroke="#FAF7F2" stroke-width="1"/>
  <line x1="420" y1="195" x2="400" y2="240" stroke="#FAF7F2" stroke-width="1"/>
  <line x1="365" y1="215" x2="435" y2="215" stroke="#FAF7F2" stroke-width="1" opacity="0.5"/>
  <line x1="380" y1="195" x2="420" y2="195" stroke="#FAF7F2" stroke-width="1" opacity="0.5"/>

  <!-- Đá trái (nhỏ) -->
  <path d="M 340 220 L 360 220 L 350 238 Z" fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linejoin="round"/>
  <line x1="340" y1="220" x2="350" y2="238" stroke="#FAF7F2" stroke-width="1" opacity="0.5"/>
  <line x1="360" y1="220" x2="350" y2="238" stroke="#FAF7F2" stroke-width="1" opacity="0.5"/>

  <!-- Đá phải (nhỏ) -->
  <path d="M 440 220 L 460 220 L 450 238 Z" fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linejoin="round"/>
  <line x1="440" y1="220" x2="450" y2="238" stroke="#FAF7F2" stroke-width="1" opacity="0.5"/>
  <line x1="460" y1="220" x2="450" y2="238" stroke="#FAF7F2" stroke-width="1" opacity="0.5"/>

  <!-- Đá dưới trái -->
  <path d="M 350 330 L 365 330 L 357 345 Z" fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linejoin="round"/>
  <!-- Đá dưới phải -->
  <path d="M 435 330 L 450 330 L 442 345 Z" fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linejoin="round"/>

  <!-- ====== GẠCH TẠO KHỐI ====== -->
  <!-- Vùng tối (vòng đeo phải, bóng) -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round">
    <line x1="470" y1="200" x2="510" y2="170" opacity="0.5"/>
    <line x1="475" y1="210" x2="515" y2="180" opacity="0.5"/>
    <line x1="480" y1="220" x2="520" y2="190" opacity="0.5"/>
    <line x1="485" y1="230" x2="520" y2="200" opacity="0.5"/>
    <line x1="490" y1="240" x2="520" y2="210" opacity="0.5"/>
  </g>
  <!-- Vùng chuyển tiếp (vòng đeo trái) -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round" opacity="0.3">
    <line x1="290" y1="170" x2="330" y2="200"/>
    <line x1="295" y1="180" x2="335" y2="210"/>
    <line x1="300" y1="190" x2="340" y2="220"/>
  </g>
</svg>
