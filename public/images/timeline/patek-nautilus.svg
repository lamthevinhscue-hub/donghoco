<svg viewBox="0 0 800 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Patek Philippe Nautilus 1976 — vỏ cửa sổ tàu thủy với bản lề hai bên</title>
  <defs>
    <pattern id="gui-patek-nautilus" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="none" stroke="#B8893C" stroke-width="0.4" opacity="0.11"/>
      <circle cx="20" cy="20" r="4" fill="none" stroke="#B8893C" stroke-width="0.3" opacity="0.11"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#B8893C" stroke-width="0.25" opacity="0.11"/>
    </pattern>
    <!-- Gân ngang song song trên mặt số -->
    <pattern id="nautilus-ribs" width="10" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="4" x2="10" y2="4" stroke="#B8893C" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#1F2D3D"/>
  <rect width="800" height="600" fill="url(#gui-patek-nautilus)"/>

  <!-- ====== DÂY LIỀN VỎ (trái + phải, thu nhỏ dần) ====== -->
  <rect x="70" y="280" width="120" height="40" rx="5" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <rect x="610" y="280" width="120" height="40" rx="5" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <!-- Mắt dây (thu nhỏ dần) -->
  <g stroke="#B8893C" stroke-width="1" opacity="0.4">
    <rect x="90" y="285" width="20" height="30" fill="none"/>
    <rect x="115" y="285" width="18" height="30" fill="none"/>
    <rect x="138" y="285" width="16" height="30" fill="none"/>
    <rect x="690" y="285" width="20" height="30" fill="none"/>
    <rect x="667" y="285" width="18" height="30" fill="none"/>
    <rect x="646" y="285" width="16" height="30" fill="none"/>
  </g>

  <!-- ====== VỎ DÁNG CỬA SỔ TÀU THỦY — tròn bo trong khung chữ nhật ====== -->
  <!-- Khung chữ nhật bo góc lớn (đặc trưng Nautilus — không phải bát giác) -->
  <path d="M 250 210 Q 250 180 290 180 L 510 180 Q 550 180 550 210 L 550 390 Q 550 420 510 420 L 290 420 Q 250 420 250 390 Z"
        fill="none" stroke="#B8893C" stroke-width="3" stroke-linejoin="round"/>

  <!-- ====== HAI CHI TIẾT BẢN LỀ NHÔ RA HAI BÊN (đặc trưng bắt buộc — cửa sổ tàu) ====== -->
  <!-- Bản lề trái — nhô ra khỏi khung chữ nhật -->
  <path d="M 250 260 L 220 260 L 220 340 L 250 340" fill="none" stroke="#B8893C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Chi tiết bản lề (đường ngang nhô ra) -->
  <line x1="220" y1="285" x2="205" y2="285" stroke="#B8893C" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="220" y1="315" x2="205" y2="315" stroke="#B8893C" stroke-width="1.75" stroke-linecap="round"/>

  <!-- Bản lề phải -->
  <path d="M 550 260 L 580 260 L 580 340 L 550 340" fill="none" stroke="#B8893C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="580" y1="285" x2="595" y2="285" stroke="#B8893C" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="580" y1="315" x2="595" y2="315" stroke="#B8893C" stroke-width="1.75" stroke-linecap="round"/>

  <!-- ====== MẶT SỐ — GÂN NGANG SONG SONG (đặc trưng Nautilus) ====== -->
  <ellipse cx="400" cy="300" rx="110" ry="95" fill="url(#nautilus-ribs)"/>
  <ellipse cx="400" cy="300" rx="110" ry="95" fill="none" stroke="#B8893C" stroke-width="1.75"/>

  <!-- Gân ngang đậm hơn (vài đường rõ) -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round" opacity="0.3">
    <line x1="300" y1="260" x2="500" y2="260"/>
    <line x1="295" y1="280" x2="505" y2="280"/>
    <line x1="292" y1="300" x2="508" y2="300"/>
    <line x1="295" y1="320" x2="505" y2="320"/>
    <line x1="300" y1="340" x2="500" y2="340"/>
  </g>

  <!-- Cọc số (đơn giản) -->
  <circle cx="400" cy="225" r="4" fill="#FAF7F2"/>
  <circle cx="475" cy="300" r="4" fill="#FAF7F2"/>
  <circle cx="400" cy="375" r="4" fill="#FAF7F2"/>
  <circle cx="325" cy="300" r="4" fill="#FAF7F2"/>

  <!-- Kim -->
  <line x1="400" y1="300" x2="400" y2="240" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="400" y1="300" x2="450" y2="270" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <circle cx="400" cy="300" r="4" fill="#FAF7F2"/>

  <!-- ====== GẠCH TẠO KHỐI ====== -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round">
    <line x1="480" y1="390" x2="520" y2="390" opacity="0.4"/>
    <line x1="485" y1="400" x2="515" y2="400" opacity="0.4"/>
    <line x1="280" y1="200" x2="320" y2="200" opacity="0.3"/>
    <line x1="285" y1="210" x2="315" y2="210" opacity="0.3"/>
  </g>
</svg>
