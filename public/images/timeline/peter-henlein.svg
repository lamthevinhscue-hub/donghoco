<svg viewBox="0 0 800 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Đồng hồ quả trứng Nuremberg — chiếc máy thời gian bỏ túi đầu tiên</title>
  <defs>
    <pattern id="gui-peter-henlein" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="none" stroke="#B8893C" stroke-width="0.4" opacity="0.06"/>
      <circle cx="12" cy="12" r="4" fill="none" stroke="#B8893C" stroke-width="0.3" opacity="0.06"/>
      <circle cx="12" cy="12" r="7" fill="none" stroke="#B8893C" stroke-width="0.25" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Nền -->
  <rect width="800" height="600" fill="#1F2D3D"/>
  <rect width="800" height="600" fill="url(#gui-peter-henlein)"/>

  <!-- Dây đeo cổ vắt qua phía trên (mảnh) -->
  <path d="M 300 95 Q 400 60 500 95" fill="none" stroke="#B8893C" stroke-width="1.75" stroke-linecap="round"/>
  <path d="M 305 103 Q 400 70 495 103" fill="none" stroke="#B8893C" stroke-width="0.75" stroke-linecap="round" opacity="0.6"/>

  <!-- Vòng đai vỏ trên (có lỗ thoát tiếng) — cung trên của quả trứng -->
  <ellipse cx="400" cy="180" rx="120" ry="55" fill="none" stroke="#B8893C" stroke-width="3" stroke-linecap="round"/>
  <!-- 7 lỗ thoát tiếng trên vòng đai -->
  <circle cx="340" cy="170" r="4" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <circle cx="370" cy="152" r="4" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <circle cx="400" cy="145" r="4" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <circle cx="430" cy="152" r="4" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <circle cx="460" cy="170" r="4" fill="none" stroke="#B8893C" stroke-width="1.75"/>

  <!-- Nắp trên bản lề đang mở hé (vòng cung nghiêng phía sau) -->
  <path d="M 290 175 Q 400 110 510 175" fill="none" stroke="#B8893C" stroke-width="0.75" opacity="0.4" stroke-linecap="round"/>

  <!-- Thân quả trứng chính — vỏ đồng hình trứng đứng -->
  <path d="M 400 130 C 480 130 510 220 510 330 C 510 430 470 500 400 500 C 330 500 290 430 290 330 C 290 220 320 130 400 130 Z"
        fill="none" stroke="#B8893C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gạch song song tạo khối (bên phải — vùng tối) -->
  <line x1="475" y1="240" x2="490" y2="240" stroke="#B8893C" stroke-width="0.75" opacity="0.5"/>
  <line x1="478" y1="270" x2="493" y2="270" stroke="#B8893C" stroke-width="0.75" opacity="0.5"/>
  <line x1="480" y1="300" x2="495" y2="300" stroke="#B8893C" stroke-width="0.75" opacity="0.5"/>
  <line x1="480" y1="330" x2="495" y2="330" stroke="#B8893C" stroke-width="0.75" opacity="0.5"/>
  <line x1="478" y1="360" x2="493" y2="360" stroke="#B8893C" stroke-width="0.75" opacity="0.5"/>
  <line x1="473" y1="390" x2="488" y2="390" stroke="#B8893C" stroke-width="0.75" opacity="0.5"/>
  <line x1="465" y1="420" x2="480" y2="420" stroke="#B8893C" stroke-width="0.75" opacity="0.5"/>
  <line x1="455" y1="450" x2="470" y2="450" stroke="#B8893C" stroke-width="0.75" opacity="0.5"/>

  <!-- Mặt số — vòng tròn bên trong -->
  <circle cx="400" cy="320" r="115" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <circle cx="400" cy="320" r="108" fill="none" stroke="#B8893C" stroke-width="0.75" opacity="0.5"/>

  <!-- Cọc số La Mã vẽ bằng path (12 vị trí, chọn vài số đại diện: XII, III, VI, IX) -->
  <!-- XII (trên) — I I -->
  <path d="M 392 230 L 392 250 M 408 230 L 408 250" fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <!-- III (phải) — I I I -->
  <path d="M 488 314 L 488 326 M 498 314 L 498 326 M 478 314 L 478 326" fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <!-- VI (dưới) — V I -->
  <path d="M 392 400 L 400 412 L 408 400" fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 406 398 L 406 414" fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <!-- IX (trái) — I I I -->
  <path d="M 302 314 L 302 326 M 312 314 L 312 326 M 322 314 L 322 326" fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>

  <!-- Vạch phút nhỏ quanh mặt số -->
  <line x1="400" y1="208" x2="400" y2="216" stroke="#B8893C" stroke-width="0.75"/>
  <line x1="510" y1="320" x2="502" y2="320" stroke="#B8893C" stroke-width="0.75"/>
  <line x1="400" y1="430" x2="400" y2="422" stroke="#B8893C" stroke-width="0.75"/>
  <line x1="290" y1="320" x2="298" y2="320" stroke="#B8893C" stroke-width="0.75"/>

  <!-- MỘT kim giờ duy nhất (chưa có kim phút thời đó) — chỉ khoảng 10 giờ -->
  <line x1="400" y1="320" x2="350" y2="270" stroke="#FAF7F2" stroke-width="3" stroke-linecap="round"/>
  <!-- Trục kim -->
  <circle cx="400" cy="320" r="5" fill="#FAF7F2"/>
</svg>
