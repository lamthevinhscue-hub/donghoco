<svg viewBox="0 0 800 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Rolex GMT-Master 1954 — vành 24 giờ duỗi thẳng thành dải phân biệt ngày đêm</title>
  <defs>
    <pattern id="gui-rolex-gmt" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="none" stroke="#B8893C" stroke-width="0.4" opacity="0.11"/>
      <circle cx="20" cy="20" r="4" fill="none" stroke="#B8893C" stroke-width="0.3" opacity="0.11"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#B8893C" stroke-width="0.25" opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#1F2D3D"/>
  <rect width="800" height="600" fill="url(#gui-rolex-gmt)"/>

  <!-- ====== DẢI VÀNH 24 GIỜ DUỖI THẲNG (bố cục ngang chính giữa) ====== -->
  <!-- Khung dải: từ x=80 tới x=720, cao từ y=240 tới y=360 -->
  <rect x="80" y="240" width="640" height="120" rx="4" fill="none" stroke="#B8893C" stroke-width="3"/>
  <line x1="80" y1="300" x2="720" y2="300" stroke="#B8893C" stroke-width="0.75" opacity="0.4"/>

  <!-- ====== NỬA TRÁI (BAN NGÀY 6h–18h): GẠCH DẬY ĐẶC ====== -->
  <!-- Nền đặc cho nửa ngày: gạch dọc chéo kín -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <line x1="240" y1="250" x2="240" y2="350"/>
    <line x1="260" y1="250" x2="260" y2="350"/>
    <line x1="280" y1="250" x2="280" y2="350"/>
    <line x1="300" y1="250" x2="300" y2="350"/>
    <line x1="320" y1="250" x2="320" y2="350"/>
    <line x1="340" y1="250" x2="340" y2="350"/>
    <line x1="360" y1="250" x2="360" y2="350"/>
    <line x1="380" y1="250" x2="380" y2="350"/>
  </g>
  <!-- Vạch lớn mỗi 2 giờ (nửa ngày: 8 vạch chính) -->
  <g stroke="#B8893C" stroke-linecap="round">
    <line x1="240" y1="240" x2="240" y2="220" stroke-width="1.75"/>
    <line x1="280" y1="240" x2="280" y2="225" stroke-width="1"/>
    <line x1="320" y1="240" x2="320" y2="225" stroke-width="1"/>
    <line x1="360" y1="240" x2="360" y2="225" stroke-width="1"/>
    <line x1="400" y1="240" x2="400" y2="220" stroke-width="1.75"/>
  </g>
  <!-- Cọc số nửa ngày (tròn nhỏ ở trên vạch lớn) -->
  <circle cx="240" cy="210" r="3.5" fill="#FAF7F2"/>
  <circle cx="400" cy="210" r="3.5" fill="#FAF7F2"/>

  <!-- ====== NỬA PHẢI (BAN ĐÊM 18h–6h): ĐỂ TRỐNG, chỉ vạch thưa ====== -->
  <g stroke="#B8893C" stroke-linecap="round">
    <line x1="440" y1="240" x2="440" y2="225" stroke-width="1"/>
    <line x1="480" y1="240" x2="480" y2="225" stroke-width="1"/>
    <line x1="520" y1="240" x2="520" y2="225" stroke-width="1"/>
    <line x1="560" y1="240" x2="560" y2="220" stroke-width="1.75"/>
    <line x1="600" y1="240" x2="600" y2="225" stroke-width="1"/>
    <line x1="640" y1="240" x2="640" y2="225" stroke-width="1"/>
    <line x1="680" y1="240" x2="680" y2="225" stroke-width="1"/>
    <line x1="720" y1="240" x2="720" y2="220" stroke-width="1.75"/>
  </g>
  <circle cx="560" cy="210" r="3.5" fill="#FAF7F2"/>
  <circle cx="720" cy="210" r="3.5" fill="#FAF7F2"/>

  <!-- Vạch trăng lưỡi liềm nhỏ ở nửa đêm (gợi đêm) -->
  <path d="M 595 200 A 8 8 0 1 0 600 212" fill="none" stroke="#FAF7F2" stroke-width="1" opacity="0.4"/>

  <!-- ====== ĐƯỜNG PHÂN CÁCH NGÀY/ĐÊM (dọc ở giữa dải = 12 giờ / trưa) ====== -->
  <line x1="400" y1="220" x2="400" y2="380" stroke="#FAF7F2" stroke-width="0.75" stroke-dasharray="6 4" opacity="0.5"/>

  <!-- ====== KIM GMT NHỎ (đầu tam giác rỗng — đặt cạnh dải, bên trên) ====== -->
  <!-- Thân kim GMT mảnh -->
  <g transform="translate(520 140)">
    <line x1="0" y1="0" x2="60" y2="40" stroke="#B8893C" stroke-width="1.75" stroke-linecap="round"/>
    <!-- Đầu tam giác RỖNG (đặc trưng bắt buộc) -->
    <path d="M 60 40 L 75 50 L 55 30 Z" fill="none" stroke="#B8893C" stroke-width="1.75" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="3" fill="#B8893C"/>
  </g>

  <!-- ====== CỌC SỐ NHỎ DƯỚI DẢI (gợi mặt số bên dưới) ====== -->
  <circle cx="240" cy="380" r="3" fill="#FAF7F2" opacity="0.5"/>
  <circle cx="320" cy="380" r="3" fill="#FAF7F2" opacity="0.5"/>
  <circle cx="400" cy="380" r="3" fill="#FAF7F2" opacity="0.5"/>
  <circle cx="480" cy="380" r="3" fill="#FAF7F2" opacity="0.5"/>
  <circle cx="560" cy="380" r="3" fill="#FAF7F2" opacity="0.5"/>
  <circle cx="640" cy="380" r="3" fill="#FAF7F2" opacity="0.5"/>

  <!-- ====== GẠCH TẠO KHỐI — vùng dưới ====== -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round">
    <line x1="160" y1="450" x2="640" y2="450" opacity="0.4"/>
    <line x1="150" y1="460" x2="650" y2="460" opacity="0.4"/>
    <line x1="155" y1="470" x2="645" y2="470" opacity="0.4"/>
  </g>
  <!-- Vùng phụ góc trên-trái -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round" opacity="0.3">
    <line x1="120" y1="100" x2="200" y2="100"/>
    <line x1="125" y1="110" x2="205" y2="110"/>
  </g>
</svg>
