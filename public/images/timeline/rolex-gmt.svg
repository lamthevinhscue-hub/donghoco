<svg viewBox="0 0 800 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Rolex GMT-Master 1954 — vành 24 giờ phân biệt ngày và đêm</title>
  <defs>
    <pattern id="gui-rolex-gmt" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="none" stroke="#B8893C" stroke-width="0.4" opacity="0.11"/>
      <circle cx="20" cy="20" r="4" fill="none" stroke="#B8893C" stroke-width="0.3" opacity="0.11"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#B8893C" stroke-width="0.25" opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#1F2D3D"/>
  <rect width="800" height="600" fill="url(#gui-rolex-gmt)"/>

  <!-- ====== VỔ (chính diện, phẳng) ====== -->
  <circle cx="400" cy="300" r="200" fill="none" stroke="#B8893C" stroke-width="3"/>
  <circle cx="400" cy="300" r="185" fill="none" stroke="#B8893C" stroke-width="1.75" opacity="0.5"/>

  <!-- ====== VÀNH 24 VẠCH — NỬA DẬY / NỬA THỦA (phân biệt ngày/đêm bằng mật độ) ====== -->
  <!-- Nửa TRÊN (ban ngày 6h-18h): vạch DẬY -->
  <g stroke="#B8893C" stroke-linecap="round">
    <line x1="400" y1="115" x2="400" y2="100" stroke-width="1.75"/>
    <line x1="445" y1="118" x2="447" y2="103" stroke-width="1"/>
    <line x1="489" y1="127" x2="493" y2="113" stroke-width="1"/>
    <line x1="531" y1="142" x2="538" y2="129" stroke-width="1"/>
    <line x1="569" y1="163" x2="579" y2="152" stroke-width="1.75"/>
    <line x1="604" y1="189" x2="615" y2="180" stroke-width="1"/>
    <line x1="633" y1="221" x2="645" y2="214" stroke-width="1"/>
    <line x1="656" y1="257" x2="668" y2="253" stroke-width="1"/>
    <line x1="670" y1="296" x2="683" y2="295" stroke-width="1.75"/>
    <line x1="675" y1="336" x2="688" y2="339" stroke-width="1"/>
    <line x1="672" y1="376" x2="684" y2="380" stroke-width="1"/>
    <line x1="660" y1="414" x2="671" y2="421" stroke-width="1"/>
    <line x1="640" y1="448" x2="650" y2="457" stroke-width="1.75"/>
  </g>
  <!-- Gạch phụ thêm cho nửa ngày (mật độ cao hơn) -->
  <g stroke="#B8893C" stroke-width="0.75" opacity="0.4">
    <line x1="423" y1="116" x2="424" y2="108"/>
    <line x1="467" y1="121" x2="469" y2="113"/>
    <line x1="510" y1="133" x2="513" y2="125"/>
    <line x1="550" y1="151" x2="555" y2="144"/>
    <line x1="588" y1="175" x2="594" y2="169"/>
    <line x1="620" y1="204" x2="628" y2="200"/>
    <line x1="646" y1="238" x2="654" y2="236"/>
    <line x1="664" y1="276" x2="672" y2="276"/>
    <line x1="668" y1="316" x2="676" y2="318"/>
  </g>

  <!-- Nửa DƯỚI (ban đêm 18h-6h): vạch THỦA (chỉ vạch lớn mỗi 2 giờ, không gạch phụ) -->
  <g stroke="#B8893C" stroke-linecap="round">
    <line x1="400" y1="485" x2="400" y2="500" stroke-width="1.75"/>
    <line x1="355" y1="482" x2="353" y2="497" stroke-width="1"/>
    <line x1="311" y1="473" x2="307" y2="487" stroke-width="1"/>
    <line x1="269" y1="458" x2="262" y2="471" stroke-width="1"/>
    <line x1="231" y1="437" x2="221" y2="448" stroke-width="1.75"/>
    <line x1="196" y1="411" x2="185" y2="420" stroke-width="1"/>
    <line x1="167" y1="379" x2="155" y2="386" stroke-width="1"/>
    <line x1="144" y1="343" x2="132" y2="347" stroke-width="1"/>
    <line x1="130" y1="304" x2="117" y2="305" stroke-width="1.75"/>
    <line x1="125" y1="264" x2="112" y2="261" stroke-width="1"/>
    <line x1="128" y1="224" x2="116" y2="220" stroke-width="1"/>
    <line x1="140" y1="186" x2="129" y2="179" stroke-width="1"/>
    <line x1="160" y1="152" x2="150" y2="143" stroke-width="1.75"/>
  </g>

  <!-- Đường phân cách ngày/đêm (đường ngang qua giữa vành) -->
  <line x1="120" y1="300" x2="680" y2="300" stroke="#FAF7F2" stroke-width="0.75" opacity="0.3" stroke-dasharray="8 4"/>

  <!-- ====== MẶT SỐ ====== -->
  <circle cx="400" cy="300" r="140" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <!-- Cọc số tròn -->
  <circle cx="400" cy="180" r="5" fill="#FAF7F2"/>
  <circle cx="490" cy="210" r="5" fill="#FAF7F2"/>
  <circle cx="520" cy="300" r="5" fill="#FAF7F2"/>
  <circle cx="490" cy="390" r="5" fill="#FAF7F2"/>
  <circle cx="400" cy="420" r="5" fill="#FAF7F2"/>
  <circle cx="310" cy="390" r="5" fill="#FAF7F2"/>
  <circle cx="280" cy="300" r="5" fill="#FAF7F2"/>
  <circle cx="310" cy="210" r="5" fill="#FAF7F2"/>

  <!-- ====== KIM GIỜ (thường) ====== -->
  <rect x="397" y="230" width="6" height="70" rx="2" fill="#FAF7F2"/>
  <!-- KIM PHÚT (dài hơn) -->
  <rect x="397" y="210" width="5" height="90" rx="2" fill="#FAF7F2"/>

  <!-- ====== KIM GMT — ĐẦU HÌNH TAM GIÁC RỖNG (đặc trưng bắt buộc) ====== -->
  <!-- Thân kim GMT (mảnh, màu brass để khác) -->
  <line x1="400" y1="300" x2="480" y2="220" stroke="#B8893C" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Đầu tam giác RỖNG (khác kim giờ thường) -->
  <path d="M 480 220 L 495 205 L 475 235 Z" fill="none" stroke="#B8893C" stroke-width="1.75" stroke-linejoin="round"/>

  <!-- Trục -->
  <circle cx="400" cy="300" r="6" fill="#FAF7F2"/>

  <!-- ====== GẠCH TẠO KHỐI ====== -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round">
    <line x1="340" y1="430" x2="460" y2="430" opacity="0.4"/>
    <line x1="335" y1="440" x2="465" y2="440" opacity="0.4"/>
    <line x1="340" y1="450" x2="460" y2="450" opacity="0.4"/>
    <line x1="345" y1="460" x2="455" y2="460" opacity="0.4"/>
  </g>
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round" opacity="0.3">
    <line x1="220" y1="200" x2="260" y2="200"/>
    <line x1="225" y1="210" x2="265" y2="210"/>
  </g>
</svg>
