<svg viewBox="0 0 800 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Vỏ đồng hồ chống nước Oyster — mặt cắt dọc thấy cơ cấu vặn ren ở ba chỗ</title>
  <defs>
    <pattern id="gui-rolex-oyster" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="none" stroke="#B8893C" stroke-width="0.4" opacity="0.11"/>
      <circle cx="20" cy="20" r="4" fill="none" stroke="#B8893C" stroke-width="0.3" opacity="0.11"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#B8893C" stroke-width="0.25" opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#1F2D3D"/>
  <rect width="800" height="600" fill="url(#gui-rolex-oyster)"/>

  <!-- Nước nền đậm hơn — nhiều lớp sóng -->
  <path d="M 80 510 Q 150 490 220 510 T 360 510 T 500 510 T 640 510 T 720 510" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <path d="M 60 535 Q 140 518 220 535 T 380 535 T 540 535 T 740 535" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <path d="M 100 560 Q 180 545 260 560 T 420 560 T 580 560 T 700 560" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.25" stroke-linecap="round"/>
  <!-- Sóng quanh vỏ -->
  <path d="M 120 380 Q 150 370 180 380" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <path d="M 620 380 Q 650 370 680 380" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <path d="M 130 420 Q 160 410 190 420" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.25" stroke-linecap="round"/>
  <path d="M 610 420 Q 640 410 670 420" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.25" stroke-linecap="round"/>

  <!-- Bọt khí bị chặn ở mép vỏ (trái + phải) -->
  <circle cx="225" cy="280" r="4" fill="none" stroke="#FAF7F2" stroke-width="1" opacity="0.5"/>
  <circle cx="210" cy="300" r="3" fill="none" stroke="#FAF7F2" stroke-width="1" opacity="0.4"/>
  <circle cx="220" cy="320" r="5" fill="none" stroke="#FAF7F2" stroke-width="1" opacity="0.5"/>
  <circle cx="205" cy="340" r="3" fill="none" stroke="#FAF7F2" stroke-width="1" opacity="0.4"/>
  <circle cx="575" cy="280" r="4" fill="none" stroke="#FAF7F2" stroke-width="1" opacity="0.5"/>
  <circle cx="590" cy="300" r="3" fill="none" stroke="#FAF7F2" stroke-width="1" opacity="0.4"/>
  <circle cx="580" cy="320" r="5" fill="none" stroke="#FAF7F2" stroke-width="1" opacity="0.5"/>
  <circle cx="595" cy="340" r="3" fill="none" stroke="#FAF7F2" stroke-width="1" opacity="0.4"/>

  <!-- ====== VỎ ĐỒNG HỒ — mặt cắt ngang nhìn bên cạnh ====== -->
  <!-- Vấu dây trái -->
  <path d="M 215 270 L 175 270 L 175 330 L 215 330" fill="none" stroke="#B8893C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Vấu dây phải -->
  <path d="M 585 270 L 625 270 L 625 330 L 585 330" fill="none" stroke="#B8893C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Thân vỏ — khối hộp tròn bo góc (mặt cắt) -->
  <rect x="215" y="190" width="370" height="220" rx="40" ry="40" fill="none" stroke="#B8893C" stroke-width="3"/>

  <!-- ====== REN VẶN — răng cưa tam giác lớn ở 3 chỗ ====== -->
  <!-- Ren VÀNH (trên): răng cưa tam giác -->
  <g fill="none" stroke="#B8893C" stroke-width="1.75" stroke-linejoin="round">
    <path d="M 250 190 L 258 178 L 266 190"/>
    <path d="M 275 190 L 283 178 L 291 190"/>
    <path d="M 300 190 L 308 178 L 316 190"/>
    <path d="M 325 190 L 333 178 L 341 190"/>
    <path d="M 459 190 L 467 178 L 475 190"/>
    <path d="M 484 190 L 492 178 L 500 190"/>
    <path d="M 509 190 L 517 178 L 525 190"/>
    <path d="M 534 190 L 542 178 L 550 190"/>
  </g>

  <!-- Ren NẮP LƯNG (dưới): răng cưa tam giác ngược -->
  <g fill="none" stroke="#B8893C" stroke-width="1.75" stroke-linejoin="round">
    <path d="M 250 410 L 258 422 L 266 410"/>
    <path d="M 275 410 L 283 422 L 291 410"/>
    <path d="M 300 410 L 308 422 L 316 410"/>
    <path d="M 325 410 L 333 422 L 341 410"/>
    <path d="M 459 410 L 467 422 L 475 410"/>
    <path d="M 484 410 L 492 422 L 500 410"/>
    <path d="M 509 410 L 517 422 L 525 410"/>
    <path d="M 534 410 L 542 422 L 550 410"/>
  </g>

  <!-- ====== VÒNG ĐỆM KÍN — khối đặc màu cream (sáng nhất hình) ====== -->
  <rect x="218" y="195" width="6" height="210" fill="#FAF7F2"/>
  <rect x="576" y="195" width="6" height="210" fill="#FAF7F2"/>
  <!-- Đệm vành (trên) -->
  <rect x="245" y="195" width="310" height="5" fill="#FAF7F2" opacity="0.85"/>
  <!-- Đệm nắp lưng (dưới) -->
  <rect x="245" y="400" width="310" height="5" fill="#FAF7F2" opacity="0.85"/>

  <!-- ====== BÁNH RĂNG CÁCH DIỆN trong khoang vỏ ====== -->
  <circle cx="350" cy="290" r="40" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <!-- Răng bánh răng lớn -->
  <g stroke="#B8893C" stroke-width="1.75" stroke-linecap="round">
    <line x1="350" y1="246" x2="350" y2="250"/>
    <line x1="372" y1="252" x2="370" y2="256"/>
    <line x1="390" y1="270" x2="386" y2="272"/>
    <line x1="394" y1="290" x2="390" y2="290"/>
    <line x1="390" y1="310" x2="386" y2="308"/>
    <line x1="372" y1="328" x2="370" y2="324"/>
    <line x1="350" y1="334" x2="350" y2="330"/>
    <line x1="328" y1="328" x2="330" y2="324"/>
    <line x1="310" y1="310" x2="314" y2="308"/>
    <line x1="306" y1="290" x2="310" y2="290"/>
    <line x1="310" y1="270" x2="314" y2="272"/>
    <line x1="328" y1="252" x2="330" y2="256"/>
  </g>
  <circle cx="350" cy="290" r="6" fill="none" stroke="#B8893C" stroke-width="1.75"/>

  <!-- Bánh răng nhỏ bên cạnh -->
  <circle cx="440" cy="320" r="25" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <g stroke="#B8893C" stroke-width="1.75" stroke-linecap="round">
    <line x1="440" y1="293" x2="440" y2="296"/>
    <line x1="458" y1="305" x2="455" y2="307"/>
    <line x1="463" y1="320" x2="460" y2="320"/>
    <line x1="458" y1="335" x2="455" y2="333"/>
    <line x1="440" y1="347" x2="440" y2="344"/>
    <line x1="422" y1="335" x2="425" y2="333"/>
    <line x1="417" y1="320" x2="420" y2="320"/>
    <line x1="422" y1="305" x2="425" y2="307"/>
  </g>
  <circle cx="440" cy="320" r="4" fill="none" stroke="#B8893C" stroke-width="1.75"/>

  <!-- Thùng cót (trái) -->
  <circle cx="490" cy="260" r="28" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <circle cx="490" cy="260" r="20" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.5"/>

  <!-- Gạch tạo khối trong khoang (vùng tối giữa các bánh răng) -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round" opacity="0.4">
    <line x1="395" y1="350" x2="415" y2="350"/>
    <line x1="395" y1="356" x2="415" y2="356"/>
    <line x1="395" y1="362" x2="415" y2="362"/>
  </g>

  <!-- ====== NÚM VẶN (phải, nối vào vỏ) ====== -->
  <rect x="585" y="275" width="60" height="50" rx="6" fill="none" stroke="#B8893C" stroke-width="3" stroke-linejoin="round"/>
  <!-- Ren núm vặn — răng cưa tam giác -->
  <g fill="none" stroke="#B8893C" stroke-width="1.75" stroke-linejoin="round">
    <path d="M 588 272 L 593 264 L 598 272"/>
    <path d="M 601 272 L 606 264 L 611 272"/>
    <path d="M 614 272 L 619 264 L 624 272"/>
    <path d="M 627 272 L 632 264 L 637 272"/>
    <path d="M 588 328 L 593 336 L 598 328"/>
    <path d="M 601 328 L 606 336 L 611 328"/>
    <path d="M 614 328 L 619 336 L 624 328"/>
    <path d="M 627 328 L 632 336 L 637 328"/>
  </g>
  <!-- Đệm kín núm vặn (cream) -->
  <rect x="582" y="278" width="5" height="44" fill="#FAF7F2"/>
  <!-- Khía núm (gạch dọc) -->
  <line x1="600" y1="275" x2="600" y2="285" stroke="#B8893C" stroke-width="1"/>
  <line x1="615" y1="275" x2="615" y2="285" stroke="#B8893C" stroke-width="1"/>
  <line x1="630" y1="275" x2="630" y2="285" stroke="#B8893C" stroke-width="1"/>
  <line x1="600" y1="315" x2="600" y2="325" stroke="#B8893C" stroke-width="1"/>
  <line x1="615" y1="315" x2="615" y2="325" stroke="#B8893C" stroke-width="1"/>
  <line x1="630" y1="315" x2="630" y2="325" stroke="#B8893C" stroke-width="1"/>
</svg>
