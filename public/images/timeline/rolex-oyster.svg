<svg viewBox="0 0 800 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Vỏ đồng hồ chống nước Oyster — mặt cắt dọc thấy cơ cấu vặn ren ở ba chỗ</title>
  <defs>
    <pattern id="gui-rolex-oyster" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="none" stroke="#B8893C" stroke-width="0.4" opacity="0.06"/>
      <circle cx="12" cy="12" r="4" fill="none" stroke="#B8893C" stroke-width="0.3" opacity="0.06"/>
      <circle cx="12" cy="12" r="7" fill="none" stroke="#B8893C" stroke-width="0.25" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Nền -->
  <rect width="800" height="600" fill="#1F2D3D"/>
  <rect width="800" height="600" fill="url(#gui-rolex-oyster)"/>

  <!-- Nét nước cong ở nền (gợi môi trường ngập) -->
  <path d="M 100 500 Q 150 480 200 500 T 300 500 T 400 500 T 500 500 T 600 500 T 700 500" fill="none" stroke="#B8893C" stroke-width="0.75" opacity="0.25" stroke-linecap="round"/>
  <path d="M 80 530 Q 140 510 200 530 T 340 530 T 480 530 T 620 530 T 720 530" fill="none" stroke="#B8893C" stroke-width="0.75" opacity="0.2" stroke-linecap="round"/>
  <path d="M 120 550 Q 180 535 240 550 T 380 550 T 520 550 T 680 550" fill="none" stroke="#B8893C" stroke-width="0.75" opacity="0.15" stroke-linecap="round"/>

  <!-- ====== MẶT CẮT DỌC VỎ ĐỒNG HỒ ====== -->
  <!-- Vỏ ngoài (hai bên) — nét chính 3px -->
  <!-- Vành trên (bezel) -->
  <path d="M 250 150 L 550 150" fill="none" stroke="#B8893C" stroke-width="3" stroke-linecap="round"/>
  <!-- Vành có ren (các nét vặn gạch xiên) -->
  <line x1="255" y1="150" x2="250" y2="158" stroke="#B8893C" stroke-width="0.75"/>
  <line x1="270" y1="150" x2="265" y2="158" stroke="#B8893C" stroke-width="0.75"/>
  <line x1="285" y1="150" x2="280" y2="158" stroke="#B8893C" stroke-width="0.75"/>
  <line x1="300" y1="150" x2="295" y2="158" stroke="#B8893C" stroke-width="0.75"/>
  <line x1="500" y1="150" x2="495" y2="158" stroke="#B8893C" stroke-width="0.75"/>
  <line x1="515" y1="150" x2="510" y2="158" stroke="#B8893C" stroke-width="0.75"/>
  <line x1="530" y1="150" x2="525" y2="158" stroke="#B8893C" stroke-width="0.75"/>
  <line x1="545" y1="150" x2="540" y2="158" stroke="#B8893C" stroke-width="0.75"/>

  <!-- Thân vỏ hai bên -->
  <line x1="245" y1="160" x2="245" y2="440" stroke="#B8893C" stroke-width="3" stroke-linecap="round"/>
  <line x1="555" y1="160" x2="555" y2="440" stroke="#B8893C" stroke-width="3" stroke-linecap="round"/>

  <!-- Nắp lưng (dưới) -->
  <path d="M 245 440 L 555 440" fill="none" stroke="#B8893C" stroke-width="3" stroke-linecap="round"/>
  <!-- Ren nắp lưng -->
  <line x1="255" y1="440" x2="250" y2="432" stroke="#B8893C" stroke-width="0.75"/>
  <line x1="275" y1="440" x2="270" y2="432" stroke="#B8893C" stroke-width="0.75"/>
  <line x1="295" y1="440" x2="290" y2="432" stroke="#B8893C" stroke-width="0.75"/>
  <line x1="505" y1="440" x2="500" y2="432" stroke="#B8893C" stroke-width="0.75"/>
  <line x1="525" y1="440" x2="520" y2="432" stroke="#B8893C" stroke-width="0.75"/>
  <line x1="545" y1="440" x2="540" y2="432" stroke="#B8893C" stroke-width="0.75"/>

  <!-- Vòng đệm kín (O-ring) — nét đậm #FAF7F2 ở 3 chỗ -->
  <!-- Đệm vành (trên) -->
  <rect x="248" y="158" width="304" height="6" fill="none" stroke="#FAF7F2" stroke-width="3"/>
  <!-- Đệm nắp lưng (dưới) -->
  <rect x="248" y="436" width="304" height="6" fill="none" stroke="#FAF7F2" stroke-width="3"/>

  <!-- Mặt số bên trong (đường ngang mảnh) -->
  <line x1="270" y1="300" x2="530" y2="300" stroke="#B8893C" stroke-width="1.75" opacity="0.4"/>

  <!-- ====== NÚM VẶN (bên phải vỏ) ====== -->
  <!-- Núm vặn hình trụ -->
  <rect x="555" y="280" width="55" height="40" fill="none" stroke="#B8893C" stroke-width="3" stroke-linejoin="round"/>
  <!-- Ren núm vặn (gạch dọc) -->
  <line x1="565" y1="280" x2="565" y2="270" stroke="#B8893C" stroke-width="0.75"/>
  <line x1="580" y1="280" x2="580" y2="270" stroke="#B8893C" stroke-width="0.75"/>
  <line x1="595" y1="280" x2="595" y2="270" stroke="#B8893C" stroke-width="0.75"/>
  <line x1="610" y1="280" x2="610" y2="270" stroke="#B8893C" stroke-width="0.75"/>
  <!-- Khía núm (gạch ngang) -->
  <line x1="555" y1="290" x2="545" y2="290" stroke="#B8893C" stroke-width="0.75"/>
  <line x1="555" y1="300" x2="545" y2="300" stroke="#B8893C" stroke-width="0.75"/>
  <line x1="555" y1="310" x2="545" y2="310" stroke="#B8893C" stroke-width="0.75"/>
  <!-- Đệm kín núm vặn -->
  <rect x="552" y="288" width="6" height="24" fill="none" stroke="#FAF7F2" stroke-width="3"/>

  <!-- Mũi tên chỉ 3 chỗ ren (gợi ý cơ cấu vặn) -->
  <!-- Mũi tên chỉ vành -->
  <path d="M 350 100 L 350 140" fill="none" stroke="#FAF7F2" stroke-width="0.75" opacity="0.6"/>
  <path d="M 346 135 L 350 142 L 354 135" fill="none" stroke="#FAF7F2" stroke-width="0.75" opacity="0.6"/>
  <!-- Mũi tên chỉ nắp lưng -->
  <path d="M 400 490 L 400 450" fill="none" stroke="#FAF7F2" stroke-width="0.75" opacity="0.6"/>
  <path d="M 396 455 L 400 448 L 404 455" fill="none" stroke="#FAF7F2" stroke-width="0.75" opacity="0.6"/>
  <!-- Mũi tên chỉ núm vặn -->
  <path d="M 680 300 L 620 300" fill="none" stroke="#FAF7F2" stroke-width="0.75" opacity="0.6"/>
  <path d="M 625 296 L 618 300 L 625 304" fill="none" stroke="#FAF7F2" stroke-width="0.75" opacity="0.6"/>
</svg>
