<svg viewBox="0 0 800 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Dây tóc silicon 2013 — cạnh sắc hình học, kết tinh của 350 năm phát triển</title>
  <defs>
    <pattern id="gui-silicon-revival" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="none" stroke="#B8893C" stroke-width="0.4" opacity="0.11"/>
      <circle cx="20" cy="20" r="4" fill="none" stroke="#B8893C" stroke-width="0.3" opacity="0.11"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#B8893C" stroke-width="0.25" opacity="0.11"/>
    </pattern>
    <!-- Lưới tinh thể silicon (mảnh phủ bề mặt) -->
    <pattern id="silicon-lattice" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="6" y2="6" stroke="#FAF7F2" stroke-width="0.3" opacity="0.15"/>
      <line x1="6" y1="0" x2="0" y2="6" stroke="#FAF7F2" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#1F2D3D"/>
  <rect width="800" height="600" fill="url(#gui-silicon-revival)"/>

  <!-- ====== DÂY TÓC THÉP TRUYỀN THỐNG (mờ ở nền — đối chiếu) ====== -->
  <g opacity="0.15" stroke="#B8893C" stroke-width="1" fill="none" stroke-linecap="round">
    <!-- Dây tóc thép 1 — xoắn ốc mềm (đường cong tròn) -->
    <circle cx="160" cy="180" r="18"/>
    <circle cx="160" cy="180" r="25"/>
    <circle cx="160" cy="180" r="32"/>
    <circle cx="160" cy="180" r="39"/>
    <!-- Dây tóc thép 2 -->
    <circle cx="640" cy="450" r="15"/>
    <circle cx="640" cy="450" r="22"/>
    <circle cx="640" cy="450" r="29"/>
  </g>

  <!-- ====== DÂY TÓC SILICON — CẠNH SẮC, GÓC VUÔNG (đặc trưng bắt buộc) ====== -->
  <!-- Vòng trong phủ lưới tinh thể -->
  <circle cx="400" cy="300" r="155" fill="url(#silicon-lattice)"/>

  <!-- Xoắn ốc silicon — CẠNH SẮC, góc vuông (khác cong mềm thép) -->
  <!-- Vòng 1 (ngoài cùng) — đường gấp khúc 8 cạnh (octagon) thay vì tròn -->
  <path d="M 400 150 L 500 170 L 550 250 L 555 300 L 550 350 L 500 430 L 400 450 L 300 430 L 250 350 L 245 300 L 250 250 L 300 170 Z"
        fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linejoin="miter"/>
  <!-- Vòng 2 -->
  <path d="M 400 180 L 470 195 L 515 260 L 520 300 L 515 340 L 470 405 L 400 420 L 330 405 L 285 340 L 280 300 L 285 260 L 330 195 Z"
        fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linejoin="miter"/>
  <!-- Vòng 3 -->
  <path d="M 400 210 L 445 220 L 475 270 L 480 300 L 475 330 L 445 380 L 400 390 L 355 380 L 325 330 L 320 300 L 325 270 L 355 220 Z"
        fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linejoin="miter"/>
  <!-- Vòng 4 -->
  <path d="M 400 240 L 420 250 L 440 280 L 442 300 L 440 320 L 420 350 L 400 360 L 380 350 L 360 320 L 358 300 L 360 280 L 380 250 Z"
        fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linejoin="miter"/>
  <!-- Vòng 5 (trong cùng) -->
  <path d="M 400 265 L 410 275 L 418 290 L 418 300 L 418 310 L 410 325 L 400 330 L 390 325 L 382 310 L 382 300 L 382 290 L 390 275 Z"
        fill="none" stroke="#FAF7F2" stroke-width="1.75" stroke-linejoin="miter"/>

  <!-- Trục giữa -->
  <circle cx="400" cy="300" r="10" fill="none" stroke="#FAF7F2" stroke-width="3"/>
  <circle cx="400" cy="300" r="4" fill="#FAF7F2"/>

  <!-- ====== GẠCH TẠO KHỐI ====== -->
  <!-- Vùng tối đậm (góc dưới-phải) -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round">
    <line x1="560" y1="480" x2="610" y2="480" opacity="0.5"/>
    <line x1="560" y1="488" x2="610" y2="488" opacity="0.5"/>
    <line x1="565" y1="496" x2="605" y2="496" opacity="0.5"/>
    <line x1="570" y1="504" x2="600" y2="504" opacity="0.5"/>
  </g>
  <!-- Vùng chuyển tiếp (góc trên-trái) -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round" opacity="0.3">
    <line x1="100" y1="420" x2="150" y2="420"/>
    <line x1="105" y1="430" x2="155" y2="430"/>
    <line x1="110" y1="440" x2="150" y2="440"/>
  </g>
</svg>
