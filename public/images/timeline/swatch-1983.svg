<svg viewBox="0 0 800 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Swatch 1983 — đồng hồ nhựa mỏng xuyên thấu cứu ngành Thụy Sĩ</title>
  <defs>
    <pattern id="gui-swatch-1983" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="none" stroke="#B8893C" stroke-width="0.4" opacity="0.11"/>
      <circle cx="20" cy="20" r="4" fill="none" stroke="#B8893C" stroke-width="0.3" opacity="0.11"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#B8893C" stroke-width="0.25" opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#1F2D3D"/>
  <rect width="800" height="600" fill="url(#gui-swatch-1983)"/>

  <!-- ====== VỎ NHỰA MỎNG (đường bao đơn giản — phóng khoáng hơn các hình khác) ====== -->
  <!-- Vỏ tròn, viền mỏng, nhìn xuyên thấu -->
  <circle cx="400" cy="300" r="200" fill="none" stroke="#B8893C" stroke-width="3"/>
  <!-- Viền trong rất mỏng -->
  <circle cx="400" cy="300" r="190" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.3"/>

  <!-- ====== RẤT ÍT CHI TIẾT BÊN TRONG (chỉ vài bánh răng — tối giản) ====== -->
  <!-- Bánh răng nhỏ 1 (giữa-trái) -->
  <circle cx="330" cy="290" r="22" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <g stroke="#B8893C" stroke-width="1.75" stroke-linecap="round">
    <line x1="330" y1="268" x2="330" y2="264"/>
    <line x1="346" y1="274" x2="349" y2="271"/>
    <line x1="352" y1="290" x2="356" y2="290"/>
    <line x1="330" y1="312" x2="330" y2="316"/>
    <line x1="314" y1="306" x2="311" y2="309"/>
    <line x1="308" y1="290" x2="304" y2="290"/>
  </g>
  <circle cx="330" cy="290" r="4" fill="none" stroke="#B8893C" stroke-width="1.75"/>

  <!-- Bánh răng nhỏ 2 (giữa-phải) -->
  <circle cx="450" cy="310" r="16" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <g stroke="#B8893C" stroke-width="1.75" stroke-linecap="round">
    <line x1="450" y1="294" x2="450" y2="291"/>
    <line x1="462" y1="300" x2="464" y2="298"/>
    <line x1="466" y1="310" x2="469" y2="310"/>
    <line x1="450" y1="326" x2="450" y2="329"/>
  </g>
  <circle cx="450" cy="310" r="3" fill="none" stroke="#B8893C" stroke-width="1.75"/>

  <!-- Pin (phẳng — đặc trưng Swatch) -->
  <rect x="380" y="340" width="40" height="12" rx="2" fill="none" stroke="#B8893C" stroke-width="1.75"/>

  <!-- ====== KIM (phóng khoáng, vui vẻ — nét dày hơn bình thường) ====== -->
  <!-- Kim giờ — nét dày, ngắn, vui -->
  <line x1="400" y1="300" x2="400" y2="230" stroke="#FAF7F2" stroke-width="3" stroke-linecap="round"/>
  <!-- Kim phút — nét dày, dài -->
  <line x1="400" y1="300" x2="470" y2="250" stroke="#FAF7F2" stroke-width="3" stroke-linecap="round"/>
  <circle cx="400" cy="300" r="5" fill="#FAF7F2"/>

  <!-- ====== VÒNG CỌC SỐ (đơn giản — chỉ chấm, phóng khoáng) ====== -->
  <circle cx="400" cy="160" r="5" fill="#FAF7F2"/>
  <circle cx="540" cy="300" r="5" fill="#FAF7F2"/>
  <circle cx="400" cy="440" r="5" fill="#FAF7F2"/>
  <circle cx="260" cy="300" r="5" fill="#FAF7F2"/>

  <!-- ====== DÂY NHỰA (đơn giản — chỉ 2 thanh mỏng) ====== -->
  <rect x="340" y="490" width="120" height="8" rx="4" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <rect x="340" y="102" width="120" height="8" rx="4" fill="none" stroke="#B8893C" stroke-width="1.75"/>

  <!-- ====== GẠCH TẠO KHỐI (tối thiểu — chỉ một vùng nhỏ) ====== -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round" opacity="0.3">
    <line x1="370" y1="370" x2="410" y2="370"/>
    <line x1="370" y1="378" x2="410" y2="378"/>
  </g>
</svg>
