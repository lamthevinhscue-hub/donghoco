<svg viewBox="0 0 800 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Đồng hồ chiến hào — bỏ túi hàn quai đeo tay 1914-1918</title>
  <defs>
    <pattern id="gui-trench-watch" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="none" stroke="#B8893C" stroke-width="0.4" opacity="0.11"/>
      <circle cx="20" cy="20" r="4" fill="none" stroke="#B8893C" stroke-width="0.3" opacity="0.11"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#B8893C" stroke-width="0.25" opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#1F2D3D"/>
  <rect width="800" height="600" fill="url(#gui-trench-watch)"/>

  <!-- ====== DÂY VẢI BẠT (trái + phải) ====== -->
  <rect x="120" y="270" width="140" height="30" rx="3" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <!-- Vân vải (gạch chéo) -->
  <g stroke="#B8893C" stroke-width="1" opacity="0.3">
    <line x1="135" y1="273" x2="145" y2="297"/>
    <line x1="155" y1="273" x2="165" y2="297"/>
    <line x1="175" y1="273" x2="185" y2="297"/>
    <line x1="195" y1="273" x2="205" y2="297"/>
    <line x1="215" y1="273" x2="225" y2="297"/>
    <line x1="235" y1="273" x2="245" y2="297"/>
  </g>

  <rect x="540" y="270" width="140" height="30" rx="3" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <g stroke="#B8893C" stroke-width="1" opacity="0.3">
    <line x1="555" y1="273" x2="565" y2="297"/>
    <line x1="575" y1="273" x2="585" y2="297"/>
    <line x1="595" y1="273" x2="605" y2="297"/>
    <line x1="615" y1="273" x2="625" y2="297"/>
    <line x1="635" y1="273" x2="645" y2="297"/>
    <line x1="655" y1="273" x2="665" y2="297"/>
  </g>

  <!-- ====== QUAI HÀN (thô, thấy rõ mối hàn) ====== -->
  <!-- Quai trái — mối hàn (cục gồ ở chân quai) -->
  <path d="M 260 280 L 285 285 L 285 305 L 260 290" fill="none" stroke="#B8893C" stroke-width="3" stroke-linejoin="round"/>
  <!-- Mối hàn (chấm nhỏ) -->
  <circle cx="282" cy="295" r="4" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <!-- Quai phải -->
  <path d="M 540 280 L 515 285 L 515 305 L 540 290" fill="none" stroke="#B8893C" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="518" cy="295" r="4" fill="none" stroke="#B8893C" stroke-width="1.75"/>

  <!-- ====== VỎ ĐỒNG HỒ (tròn, từ bỏ túi) ====== -->
  <circle cx="400" cy="300" r="130" fill="none" stroke="#B8893C" stroke-width="3"/>
  <circle cx="400" cy="300" r="120" fill="none" stroke="#B8893C" stroke-width="1.75" opacity="0.5"/>

  <!-- ====== LỒNG LƯỚI BẢO VỆ MẶT KÍNH ====== -->
  <!-- Khung lồng -->
  <circle cx="400" cy="300" r="108" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <!-- Lưới dọc -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round" opacity="0.6">
    <line x1="335" y1="240" x2="335" y2="360"/>
    <line x1="360" y1="220" x2="360" y2="380"/>
    <line x1="385" y1="210" x2="385" y2="390"/>
    <line x1="400" y1="208" x2="400" y2="392"/>
    <line x1="415" y1="210" x2="415" y2="390"/>
    <line x1="440" y1="220" x2="440" y2="380"/>
    <line x1="465" y1="240" x2="465" y2="360"/>
  </g>
  <!-- Lưới ngang -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round" opacity="0.4">
    <line x1="305" y1="265" x2="495" y2="265"/>
    <line x1="300" y1="300" x2="500" y2="300"/>
    <line x1="305" y1="335" x2="495" y2="335"/>
  </g>

  <!-- ====== CỌC SỐ DẠ QUANG (chấm tròn nhỏ) ====== -->
  <circle cx="400" cy="215" r="5" fill="#FAF7F2"/>
  <circle cx="478" cy="238" r="4" fill="#FAF7F2"/>
  <circle cx="485" cy="300" r="4" fill="#FAF7F2"/>
  <circle cx="478" cy="362" r="4" fill="#FAF7F2"/>
  <circle cx="400" cy="385" r="4" fill="#FAF7F2"/>
  <circle cx="322" cy="362" r="4" fill="#FAF7F2"/>
  <circle cx="315" cy="300" r="4" fill="#FAF7F2"/>
  <circle cx="322" cy="238" r="4" fill="#FAF7F2"/>

  <!-- Kim (nhìn qua lưới) -->
  <line x1="400" y1="300" x2="400" y2="245" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="400" y1="300" x2="445" y2="275" stroke="#FAF7F2" stroke-width="1.75" stroke-linecap="round"/>

  <!-- ====== GẠCH TẠO KHỐI ====== -->
  <!-- Vùng tối (nửa phải vỏ) -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round">
    <line x1="480" y1="200" x2="510" y2="200" opacity="0.5"/>
    <line x1="488" y1="210" x2="515" y2="210" opacity="0.5"/>
    <line x1="495" y1="220" x2="520" y2="220" opacity="0.5"/>
    <line x1="498" y1="230" x2="522" y2="230" opacity="0.5"/>
    <line x1="500" y1="240" x2="522" y2="240" opacity="0.5"/>
    <line x1="498" y1="250" x2="518" y2="250" opacity="0.5"/>
    <line x1="493" y1="260" x2="512" y2="260" opacity="0.5"/>
  </g>
  <!-- Vùng chuyển tiếp (nửa dưới vỏ) -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round" opacity="0.3">
    <line x1="350" y1="395" x2="450" y2="395"/>
    <line x1="360" y1="405" x2="440" y2="405"/>
    <line x1="370" y1="415" x2="430" y2="415"/>
  </g>

  <!-- Núm vặn nhỏ (trên cùng) -->
  <circle cx="400" cy="170" r="8" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <line x1="400" y1="162" x2="400" y2="155" stroke="#B8893C" stroke-width="1.75" stroke-linecap="round"/>
</svg>
