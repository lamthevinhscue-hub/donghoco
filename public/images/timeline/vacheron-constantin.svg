<svg viewBox="0 0 800 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Bản hợp đồng học nghề — khởi đầu Vacheron Constantin tại Geneva 1755</title>
  <defs>
    <pattern id="gui-vacheron-constantin" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="none" stroke="#B8893C" stroke-width="0.4" opacity="0.11"/>
      <circle cx="20" cy="20" r="4" fill="none" stroke="#B8893C" stroke-width="0.3" opacity="0.11"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#B8893C" stroke-width="0.25" opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#1F2D3D"/>
  <rect width="800" height="600" fill="url(#gui-vacheron-constantin)"/>

  <!-- ====== TỜ GIẤY HỢP ĐỒNG (trải nghiêng trên mặt bàn) ====== -->
  <!-- Giấy — hình thang nhẹ (phối cảnh nghiêng) -->
  <path d="M 150 200 L 680 170 L 700 480 L 130 510 Z"
        fill="none" stroke="#B8893C" stroke-width="3" stroke-linejoin="round"/>
  <!-- Nếp gấp giấy (đường gập giữa) -->
  <line x1="400" y1="185" x2="415" y2="495" stroke="#B8893C" stroke-width="1" opacity="0.5"/>

  <!-- ====== DÒNG KẺ GỢI CHỮ VIẾT TAY (vẽ bằng nét lượn, không dùng text) ====== -->
  <g stroke="#B8893C" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.45">
    <!-- Nửa trái, dòng 1 -->
    <path d="M 180 240 Q 200 235 220 240 Q 240 245 260 238 Q 280 233 300 240 Q 320 245 340 238"/>
    <!-- Dòng 2 -->
    <path d="M 175 265 Q 195 260 215 265 Q 235 270 255 263 Q 275 258 295 265 Q 315 270 335 263"/>
    <!-- Dòng 3 -->
    <path d="M 180 290 Q 200 285 220 290 Q 240 295 260 288 Q 280 283 300 290"/>
    <!-- Dòng 4 -->
    <path d="M 175 315 Q 195 310 215 315 Q 235 320 255 313"/>
    <!-- Nửa phải (sau nếp gấp) -->
    <path d="M 440 235 Q 460 230 480 235 Q 500 240 520 233 Q 540 228 560 235 Q 580 240 600 233 Q 620 228 640 235"/>
    <path d="M 445 260 Q 465 255 485 260 Q 505 265 525 258 Q 545 253 565 260 Q 585 265 605 258 Q 625 253 645 260"/>
    <path d="M 440 285 Q 460 280 480 285 Q 500 290 520 283 Q 540 278 560 285 Q 580 290 600 283"/>
  </g>

  <!-- Dấu son (vòng tròn mờ — con dấu) -->
  <circle cx="600" cy="440" r="28" fill="none" stroke="#B8893C" stroke-width="1.75" opacity="0.4"/>
  <circle cx="600" cy="440" r="22" fill="none" stroke="#B8893C" stroke-width="1" opacity="0.3"/>

  <!-- ====== BÀN TAY THỢ CẢ (đặt trên giấy, góc dưới trái) ====== -->
  <!-- Lòng bàn tay + ngón tay (nhìn từ trên, không có khuôn mặt) -->
  <g stroke="#FAF7F2" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lòng bàn -->
    <path d="M 220 350 Q 200 340 195 360 Q 192 380 210 395 Q 230 405 260 400 Q 280 395 285 375 Q 288 355 270 345 Q 250 340 220 350 Z"/>
    <!-- Ngón cái -->
    <path d="M 200 365 Q 185 355 178 340 Q 175 330 182 325"/>
    <!-- Ngón trỏ -->
    <path d="M 215 348 Q 210 330 208 310 Q 207 298 212 292"/>
    <!-- Ngón giữa -->
    <path d="M 240 345 Q 238 325 240 305 Q 242 292 248 287"/>
    <!-- Ngón áp -->
    <path d="M 262 348 Q 265 330 270 315 Q 274 305 280 302"/>
  </g>

  <!-- ====== BÚT LÔNG NGỖNG (nghiêng trên giấy, góc phải) ====== -->
  <!-- Thân bút -->
  <line x1="340" y1="430" x2="560" y2="250" stroke="#B8893C" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Lông ngỗng (đầu bút, tóp nhọn) -->
  <path d="M 560 250 Q 575 240 585 230 Q 590 225 583 220 Q 575 218 568 225 Q 562 232 560 250"
        fill="none" stroke="#B8893C" stroke-width="1.75" stroke-linejoin="round"/>
  <!-- Vân lông -->
  <line x1="570" y1="240" x2="580" y2="232" stroke="#B8893C" stroke-width="0.75"/>
  <line x1="568" y1="245" x2="578" y2="237" stroke="#B8893C" stroke-width="0.75"/>
  <!-- Điểm mực ở đầu bút -->
  <circle cx="338" cy="432" r="3" fill="#FAF7F2"/>

  <!-- ====== VÀI BÁNH RĂNG NHỎ (cạnh tay, góc dưới) ====== -->
  <circle cx="380" cy="420" r="18" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <g stroke="#B8893C" stroke-width="1.75" stroke-linecap="round">
    <line x1="380" y1="402" x2="380" y2="398"/>
    <line x1="392" y1="408" x2="395" y2="405"/>
    <line x1="398" y1="420" x2="402" y2="420"/>
    <line x1="392" y1="432" x2="395" y2="435"/>
    <line x1="380" y1="438" x2="380" y2="442"/>
    <line x1="368" y1="432" x2="365" y2="435"/>
    <line x1="362" y1="420" x2="358" y2="420"/>
    <line x1="368" y1="408" x2="365" y2="405"/>
  </g>
  <circle cx="380" cy="420" r="4" fill="none" stroke="#B8893C" stroke-width="1.75"/>

  <!-- Bánh răng thứ 2 (nhỏ hơn) -->
  <circle cx="430" cy="460" r="12" fill="none" stroke="#B8893C" stroke-width="1.75"/>
  <g stroke="#B8893C" stroke-width="1.75" stroke-linecap="round">
    <line x1="430" y1="448" x2="430" y2="445"/>
    <line x1="439" y1="453" x2="441" y2="451"/>
    <line x1="442" y1="460" x2="445" y2="460"/>
    <line x1="430" y1="472" x2="430" y2="475"/>
    <line x1="418" y1="460" x2="415" y2="460"/>
  </g>
  <circle cx="430" cy="460" r="3" fill="none" stroke="#B8893C" stroke-width="1.75"/>

  <!-- ====== GẠCH TẠO KHỐI ====== -->
  <!-- Vùng tối đậm (bóng tay trên giấy) -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round" opacity="0.3">
    <line x1="190" y1="420" x2="230" y2="420"/>
    <line x1="195" y1="430" x2="235" y2="430"/>
    <line x1="200" y1="440" x2="240" y2="440"/>
    <line x1="205" y1="450" x2="245" y2="450"/>
  </g>
  <!-- Vùng chuyển tiếp (góc phải giấy, bóng) -->
  <g stroke="#B8893C" stroke-width="1" stroke-linecap="round" opacity="0.35">
    <line x1="640" y1="380" x2="680" y2="380"/>
    <line x1="640" y1="390" x2="680" y2="390"/>
    <line x1="640" y1="400" x2="675" y2="400"/>
  </g>
</svg>
