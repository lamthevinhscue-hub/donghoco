<!doctype html>
<!-- Trang kiểm video V3: chạy kiểm seek rồi ghi kết quả vào window.__kq -->
<html lang="vi"><head><meta charset="utf-8"><title>kiểm video</title></head>
<body>
<video id="v" src="/public/videos/v3-escapement/bo-thoat-chu-ky-truot.webm" muted preload="auto"></video>
<script>
window.__kq = null;
async function hash(v) {
  const c = document.createElement('canvas');
  c.width = 96; c.height = 54;
  const ctx = c.getContext('2d');
  ctx.drawImage(v, 0, 0, 96, 54);
  const d = ctx.getImageData(0, 0, 96, 54).data;
  let tong = 0;
  for (let i = 0; i < d.length; i += 4) tong += d[i] + d[i + 1] + d[i + 2];
  return tong;
}
window.__chay = async () => {
  const v = document.getElementById('v');
  await new Promise((r) => {
    if (v.readyState >= 1) return r();
    v.addEventListener('loadedmetadata', r, { once: true });
    v.addEventListener('error', () => { window.__kq = { loi: 'video lỗi: ' + (v.error && v.error.code) }; r(); }, { once: true });
  });
  if (window.__kq) return;
  const pha = [890, 1840, 2040, 2240, 4040, 5840, 6040, 7000, 7900];
  const ketQua = [];
  for (const ms of pha) {
    const seekXong = new Promise((r) => v.addEventListener('seeked', r, { once: true }));
    v.currentTime = ms / 1000;
    await Promise.race([seekXong, new Promise((r) => setTimeout(r, 4000))]);
    ketQua.push({ ms, thucTe: Math.round(v.currentTime * 1000), hash: await hash(v) });
  }
  v.currentTime = 7.9;
  await new Promise((r) => v.addEventListener('seeked', r, { once: true }));
  const nguoc1 = Math.round(v.currentTime * 1000);
  v.currentTime = 0.89;
  await new Promise((r) => v.addEventListener('seeked', r, { once: true }));
  window.__kq = { duration: Math.round(v.duration * 1000), ketQua, seekNguoc: { tu: nguoc1, ve: Math.round(v.currentTime * 1000) } };
};
</script>
</body></html>
